# TFT24 (12864 emulation) menu tweaks. Klipper's default menu has an "OctoPrint" list that
# sends OctoPrint action commands; this printer runs Mainsail, so that list is replaced by a
# "Print" list using the Mainsail macros (PAUSE / RESUME / CANCEL_PRINT) and the heat soak.
[menu __main __octoprint]
type: disabled

[menu __main __print]
type: list
name: Print
index: 0

[menu __main __print __pause]
type: command
enable: {printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused}
name: Pause
gcode:
    PAUSE

[menu __main __print __resume]
type: command
enable: {printer.pause_resume.is_paused}
name: Resume
gcode:
    RESUME

[menu __main __print __cancel]
type: command
enable: {printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused}
name: Cancel print
gcode:
    CANCEL_PRINT

[menu __main __print __soak_skip]
type: command
enable: {printer["gcode_macro _SOAK_STATE"].active}
name: Skip heat soak
gcode:
    HEAT_SOAK_SKIP
