#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    # Park at the back, 50mm above the current height (max 200mm, never lower).
    # Not Z260: at full height the cable chain drags and X homing can false-stall.
    {% set th = printer.toolhead %}
    {% set z = [[th.position.z + 50, 200]|min, th.position.z]|max %}
    G90
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y} Z{z} F6000

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    # stop a heat soak that may be running
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0
    {% if 'xyz' in printer.toolhead.homed_axes %}
        PARK
    {% endif %}
    {% if printer.extruder.can_extrude %}
        G91
        G1 E-2 F2700               ; retract only if hot enough (cold retract errors and aborted the cancel)
        G90
    {% endif %}
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    
    BASE_CANCEL_PRINT

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    SMART_HOME
    SMART_QGL
    RESTORE_GCODE_STATE NAME=STATE_G32
   
# Counts how many minutes in a row the bed has been at 80C or hotter.
[gcode_macro _SOAK_TRACKER]
variable_minutes_hot: 0
gcode:

[delayed_gcode _SOAK_TICK]
initial_duration: 60
gcode:
    {% set t = printer["gcode_macro _SOAK_TRACKER"].minutes_hot %}
    {% if printer.heater_bed.temperature >= 78 %}
        SET_GCODE_VARIABLE MACRO=_SOAK_TRACKER VARIABLE=minutes_hot VALUE={t + 1}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_SOAK_TRACKER VARIABLE=minutes_hot VALUE=0
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_SOAK_TICK DURATION=60

[gcode_macro PRINT_START]
#   Slicer: PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single] FILAMENT=[filament_type]
#   Heats and homes, then (if needed) runs a NON-BLOCKING heat soak: the print is paused and
#   a 10s timer counts down, so Cancel and other commands keep working. When the soak ends
#   the timer runs _PRINT_START_FINISH (QGL, mesh, nozzle heat, purge) and resumes the print.
#   HEAT_SOAK_SKIP ends the soak early.
gcode:
    {% set BED = params.BED|default(100)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(240)|int %}
    {% set FILAMENT = params.FILAMENT|default("Unknown")|string %}
    # Soak length: 20 min for ASA/ABS bed temps (100C+), 10 min below; SOAK= overrides
    {% set SOAK_MIN = params.SOAK|default(20 if BED >= 100 else 10)|int %}
    {% set CHAMBER = params.CHAMBER|default(45 if BED >= 100 else 0)|int %}
    {% set has_chamber = "temperature_sensor chamber" in printer %}
    # Minutes the bed was already hot before this print (from _SOAK_TRACKER)
    {% set already_hot = printer["gcode_macro _SOAK_TRACKER"].minutes_hot %}

    UPDATE_DELAYED_GCODE ID=_DELAYED_MOTORS_OFF DURATION=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=extruder VALUE={EXTRUDER}
    # MESH=SAVED loads the stored full 'default' mesh instead of probing a new one
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=mesh VALUE='"{params.MESH|default("adaptive")|lower}"'
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=filament VALUE='"{FILAMENT}"'

    M117 {FILAMENT}: heating bed {BED}C
    RESPOND MSG="{FILAMENT} print start: bed {BED}C, nozzle {EXTRUDER}C"
    M140 S{BED}                    ; start bed heating
    M104 S150                      ; warm nozzle without oozing
    G28                            ; home all axes
    G90
    G1 X150 Y150 Z20 F6000         ; park over bed center
    # Wait only until the bed is at least BED; a hotter bed is not cooled down
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 1}

    {% if BED >= 80 and already_hot < SOAK_MIN %}
        {% set left = SOAK_MIN - already_hot %}
        {% if has_chamber and CHAMBER > 0 %}
            RESPOND MSG="Running {FILAMENT} heat soak: bed {BED}C for {left} min, then until chamber reaches {CHAMBER}C. Cancel works; HEAT_SOAK_SKIP ends it early."
        {% else %}
            RESPOND MSG="Running {FILAMENT} heat soak: bed {BED}C for {left} min. Cancel works; HEAT_SOAK_SKIP ends it early."
        {% endif %}
        _HEAT_SOAK_BEGIN SECONDS={left * 60} BED={BED} CHAMBER={CHAMBER if has_chamber else 0} RESUME_PRINT=1
        PAUSE_BASE                 ; stop reading the file; the soak timer resumes it
    {% else %}
        {% if BED >= 80 %}
            RESPOND MSG="Skipping {FILAMENT} heat soak: bed has been hot for {already_hot} min"
        {% endif %}
        _PRINT_START_FINISH
    {% endif %}

[gcode_macro _PRINT_START_FINISH]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    # SMART_QGL only levels if motors were turned off since the last QGL
    # (Klipper clears 'applied' on motor off), and re-homes Z after leveling
    SMART_QGL
    SET_VELOCITY_LIMIT VELOCITY=150 ACCEL=1500
    SET_SKEW XY=139.5,141.9,99.46
    {% if s.mesh == "saved" %}
        BED_MESH_PROFILE LOAD=default  ; stored full-bed mesh (no probing)
    {% else %}
        BED_MESH_CALIBRATE         ; KAMP adaptive mesh
    {% endif %}
    M117 Heating nozzle...
    M109 S{s.extruder}             ; full nozzle temp only right before purge
    VORON_PURGE
    M117 Printing

[gcode_macro _SOAK_STATE]
variable_active: 0
variable_seconds_left: 0
variable_chamber: 0
variable_bed_target: 0
variable_chamber_wait_left: 0
variable_resume_print: 0
variable_extruder: 240
variable_filament: "Manual"
variable_mesh: "adaptive"
gcode:

[gcode_macro _HEAT_SOAK_BEGIN]
gcode:
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE={params.SECONDS|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber VALUE={params.CHAMBER|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=bed_target VALUE={params.BED|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber_wait_left VALUE=1800
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE={params.RESUME_PRINT|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10

[delayed_gcode _HEAT_SOAK_TIMER]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    {% if s.active %}
        {% set left = s.seconds_left - 10 %}
        {% set chamber_ok = s.chamber == 0 or printer["temperature_sensor chamber"].temperature >= s.chamber %}
        G4 P10                     ; tiny dwell keeps idle_timeout from shutting the heaters off
        {% if printer.heater_bed.temperature < s.bed_target - 1 %}
            M117 {s.filament} bed {printer.heater_bed.temperature|int}/{s.bed_target}C
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% elif left > 0 %}
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE={left}
            M117 {s.filament} soak {(left / 60)|round(0, 'ceil')|int}m left
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% elif not chamber_ok and s.chamber_wait_left > 0 %}
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE=0
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber_wait_left VALUE={s.chamber_wait_left - 10}
            M117 {s.filament} chamber to {s.chamber}C
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% else %}
            _HEAT_SOAK_DONE
        {% endif %}
    {% endif %}

[gcode_macro _HEAT_SOAK_DONE]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0
    RESPOND MSG="{s.filament} heat soak done"
    M117 {s.filament} soak done
    {% if s.resume_print %}
        SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE=0
        _PRINT_START_FINISH
        RESUME_BASE
    {% endif %}

[gcode_macro HEAT_SOAK_SKIP]
description: End the running heat soak now (the print continues normally)
gcode:
    {% if printer["gcode_macro _SOAK_STATE"].active %}
        RESPOND MSG="Heat soak skipped"
        _HEAT_SOAK_DONE
    {% else %}
        RESPOND MSG="No heat soak is running"
    {% endif %}

[gcode_macro HEAT_SOAK_STOP]
description: Stop a manual heat soak (bed stays at temperature)
gcode:
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0
    RESPOND MSG="Heat soak stopped"
    M117

[gcode_macro HEAT_SOAK_START]
description: Manual heat soak: HEAT_SOAK_START TEMP=100 MINUTES=20 FILAMENT=ASA (non-blocking; HEAT_SOAK_STOP ends it)
gcode:
    {% set temp = params.TEMP|default(100)|int %}
    {% set mins = params.MINUTES|default(20)|int %}
    {% set filament = params.FILAMENT|default("Manual")|string %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=filament VALUE='"{filament}"'
    RESPOND MSG="Running {filament} heat soak: bed {temp}C for {mins} min once at temperature. HEAT_SOAK_STOP ends it."
    SMART_HOME
    G90
    G1 X150 Y150 Z20 F6000   ; park nozzle over bed center
    M140 S{temp}             ; heat bed (no blocking wait; the timer waits for it)
    _HEAT_SOAK_BEGIN SECONDS={mins * 60} BED={temp} CHAMBER=0 RESUME_PRINT=0

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [[th.position.z + 50, 200]|min, th.position.z]|max %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; fast 10mm retract out of the melt zone (Voron stock PRINT_END value)
    
    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    PARK


[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=5  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}

[gcode_macro SMART_HOME]

gcode:
    {% if printer.toolhead.homed_axes == "xyz" %}
        M117 Printer is already homed
    {% else %}
        M117 Printer needs homed...
        G28
    {% endif %}


[gcode_macro SMART_QGL]
gcode:
    {% if printer.quad_gantry_level.applied|lower == 'false' %}
        SMART_HOME
        M117 Printer needs leveling...
        QUAD_GANTRY_LEVEL
        G28 Z                      ; re-home Z after QGL
    {% else %}
        M117 Printer is already leveled
    {% endif %}
    
[gcode_macro BED_LVL_MESH]
gcode:
  M190 S100                ; heat bed (run HEAT_SOAK_START first for a full soak)
  SMART_QGL
  BED_MESH_CALIBRATE PROFILE=default METHOD=automatic
  SAVE_CONFIG
  
[gcode_macro SMART_ZOFF]
gcode:
  {% if printer.heater_bed.target <= 60 %}
    SET_GCODE_OFFSET Z=-0.090
  {% elif printer.heater_bed.target <= 75  %}
    SET_GCODE_OFFSET Z=-0.06
  {% elif printer.heater_bed.target <= 90  %}
    SET_GCODE_OFFSET Z=-0.03
  {% else %}
    SET_GCODE_OFFSET Z=0.0
  {% endif %}

[delayed_gcode _DELAYED_MOTORS_OFF]
gcode:
    # Only if nothing happened since the idle timeout fired (state still Idle) and no print is running
    {% if printer.idle_timeout.state == "Idle" and printer.print_stats.state not in ["printing", "paused"] %}
        M84
        RESPOND MSG="Motors off after 2 hours idle"
    {% endif %}

