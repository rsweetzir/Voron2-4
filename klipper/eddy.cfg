# BTT Eddy Duo on the CAN bus (DIP switch CAN, 120R off; 5 V + GND from the EBB bottom header,
# CAN-H/L on the EBB pass-through pins). Firmware: firmware/eddy-can.config. Replaces the
# inductive probe on EBB PB9 (2026-10-07). Calibration order (docs/Eddy_Probe.md):
#   1. LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy   (sensor ~20mm over the bed centre), SAVE_CONFIG
#   2. PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy  (paper test at the centre), SAVE_CONFIG
#   3. tap_threshold (PROBE METHOD=tap), then _EDDY home_method "tap"
#   4. thermal drift: TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=... STEP=...

# Bus termination: USB-CAN adapter 120R + EBB 120R jumper (fitted 2026-10-08; without it
# CAN errors caused EBBCan "Timer too close" shutdowns). Eddy 120R stays off.
[mcu eddy]
canbus_uuid: 9d2f9ffa77f0

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0             # BTT Stealthburner mount
y_offset: 21.42
descend_z: 0.5          # recommended by docs/Eddy_Probe.md
tap_threshold: 20       # tuned 2026-10-07: 10 stopped in mid-air; 20: PROBE_ACCURACY METHOD=tap range 0.020mm

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# Homing correction (docs/Eddy_Probe.md): G28 Z with an eddy probe has an offset error;
# probing does not. The homing override runs SET_Z_FROM_PROBE after G28 Z.
[gcode_macro _EDDY]
variable_home_method: "tap"   # Z0 = nozzle contact (tap); "automatic" = contactless eddy reading
gcode:

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
    {% set Z = printer.toolhead.position.z %}
    SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set METHOD = params.METHOD|default(printer["gcode_macro _EDDY"].home_method) %}
    G90
    G0 Z3 F600                     ; G28 Z stops at descend_z (0.5): lift so the probe has room
    PROBE METHOD={METHOD}
    _RELOAD_Z_OFFSET_FROM_PROBE
    G0 Z5
