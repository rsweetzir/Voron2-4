[bed_mesh]
##----------------------350mm build-------------------------------------
speed: 225
horizontal_move_z: 2         # eddy (was 10 for the inductive probe)
adaptive_margin: 15
mesh_min: 25, 25
mesh_max: 325, 325
zero_reference_position: 175,200 # eddy XY when Z homes (nozzle at 175,175, eddy y_offset 25)
fade_start: 0.6
fade_end: 10.0
probe_count: 31,31          # eddy rapid_scan (~10 mm spacing, as Edmonton); adaptive meshes keep this spacing
algorithm: bicubic
##--------------------------------------------------------------------
