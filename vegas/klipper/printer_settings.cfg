# Las Vegas: printer-specific values for the SHARED macros in shared/ (docs/printer-parity.md).
# Only values that really differ between the printers belong here; the logic is shared.
[gcode_macro _PRINTER_SETTINGS]
variable_center_x: 175         # bed centre (nozzle): Z homing, tap, soak park
variable_center_y: 175
variable_skew_ac: 139.5        # XY skew (AC, BD, AD), measured 2026-11-04 with a tape on a 100 mm frame:
variable_skew_bd: 137.0        # ~1.0 deg (X shifts 1.8 mm per 100 mm Y). Refine with calipers; consider
variable_skew_ad: 98.0         # squaring the gantry mechanically (Klipper recommends it above ~0.5 deg)
variable_filament_park: 0      # 0 = off: this hotend loads only to the top of the gears (gear-to-nozzle ~70-75 mm)
variable_chamber_temp: 42      # PRINT_START waits for this chamber temp at beds >= 100C (T1 sensor); same as Edmonton. ASA corners lifted when the first layers went down in a cooler chamber (2026-11-09)
variable_saved_mesh: ""        # no saved full-bed mesh profile
variable_tap_temp: 150         # nozzle C for the tap (PLA/PETG)
variable_tap_temp_hard: 180    # nozzle C for the tap with ASA/ABS/PC/PA or beds >= 90C
variable_soak_park_z: 15       # nozzle height over the bed centre during the soak. Was 3: with the 110C soak boost the
                               # eddy coil reached 76C (drift calibrated to 56C) and its readings failed (2026-11-11)
variable_tap_z_adjust: 0.15      # mm a tap reads above real bed contact (Vegas first layer was ~0.15 high, 2026-11-05); not applied to TPU/TPE/FLEX (hot tap, see _RELOAD_Z_OFFSET_FROM_PROBE)
variable_exhaust_after_print: 10  # minutes PRINT_END runs the exhaust at 100% (fan_generic exhaust_fan); 0 = off
variable_accel_limit: 3000      # mm/s2 cap on any SET_VELOCITY_LIMIT ACCEL (slicer per feature). 2000 until the input shaper (4000 / 300 shifted layers, 2026-11-05); 3000 after it (Y mzv allows 3400, 2026-11-11)
variable_velocity_limit: 200     # mm/s cap on SET_VELOCITY_LIMIT VELOCITY
variable_qgl_fine_z: 10        # fine QGL probing height
variable_soak_bed_boost: 10    # C added to the bed during the soak when PRINT_START waits for the chamber (big chamber); back to print temp before the mesh
variable_z_method: "contactless"   # print start Z0: "tap" (nozzle contact) or "contactless" (eddy reading); tap readings
                                   # moved 0.15-0.3 mm with nozzle residue and tap temperature (2026-11-05..08)
variable_contactless_z_offset: -0.25 # babystep that gives a good first layer with contactless Z (negative = closer); -0.40 squashed the 1st contactless ASA layer, -0.35 left rough solid layers above it, -0.30 still some (2026-11-08/09);
                                   # set from the first contactless print, recheck after a nozzle change
gcode:

[firmware_retraction]
retract_length: 0.5        # calsuite sets its own with SET_RETRACTION
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

# Mainsail PAUSE/RESUME/CANCEL settings (350mm bed):
#  - park at centre-back, not on the frame
#  - longer idle timeout while paused, so a calibration question can wait 2 hours
#  - RESUME re-runs an unfinished print start (shared CANCEL_PRINT stops a running soak)
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 175.0
variable_custom_park_y    : 340.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 2.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 175.0
variable_park_at_cancel_y : 340.0
variable_use_fw_retract   : True
variable_idle_timeout     : 7200
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: "_PRINT_START_RECOVER"
variable_user_cancel_macro: "FILAMENT_PARK"   # no-op here (filament_park 0); CANCEL_PRINT stops the soak
gcode:
