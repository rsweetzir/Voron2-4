# This file contains common pin mappings for the BigTreeTech SKR PRO.
# To use this config, the firmware should be compiled for the
# STM32F407 with a "32KiB bootloader".

# The "make flash" command does not work on the SKR PRO. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR PRO
# with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include ebb_extruder.cfg]
[include mainsail.cfg]
#[include sensorless.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]
[include calibration.cfg]  # one-plate filament calibration suite (tools/calsuite.py)
[skew_correction]
[exclude_object]
[auto_speed]
margin: 20
settling_home: 1      ; Perform settling home before starting Auto Speed
max_missed: 20.0       ; Maximum full steps that can be missed
endstop_samples: 2

[force_move]
enable_force_move: True

[stepper_x]
step_pin: PE9
dir_pin:  PF1
enable_pin: !PF2
endstop_pin: tmc2209_stepper_x:virtual_endstop
#endstop_pin: PB10
rotation_distance: 39.7 #40*114.14/115
microsteps: 128
full_steps_per_rotation: 200  
position_endstop: 300
position_max: 300
homing_speed: 20
homing_retract_dist: 0

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC13
interpolate: false
run_current: .8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PB10    # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 45 # 255 is most sensitive value, 0 is least sensitive

[stepper_y]
step_pin: PE11
dir_pin:  PE8
enable_pin: !PD7
rotation_distance: 39.66 #40*114.04/115
microsteps: 128
full_steps_per_rotation:200  
endstop_pin: tmc2209_stepper_y:virtual_endstop
#endstop_pin: PE12
position_endstop: 300
position_max: 300
homing_speed: 20
homing_retract_dist: 0


[tmc2209 stepper_y]
uart_pin: PE3
interpolate: false
run_current: .8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PE12    # Set to MCU pin connected to TMC DIAG pin
driver_SGTHRS: 45 # 255 is most sensitive value, 0 is least sensitive

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]

step_pin: PE13
dir_pin: PC2
enable_pin: !PC0
endstop_pin: probe:z_virtual_endstop #PG8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
#position_endstop: -2.65
position_max: 260
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PE1
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PE14
dir_pin: !PA0
enable_pin: !PC3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PD15
dir_pin: PE7
enable_pin: !PA3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16


[tmc2209 stepper_z2]
uart_pin: PD1
interpolate: false
run_current:  0.8
sense_resistor: 0.110
stealthchop_threshold: 0


##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PD13
dir_pin: !PG9
enable_pin: !PF0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[heater_bed]
heater_pin: PD12
sensor_pin: PF3 # T0
sensor_type: Generic 3950
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769


[probe]
pin: ~!EBBCan:PB9
x_offset: 0
y_offset: 25.0
#z_offset: 2.650
speed: 5
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.015
samples_tolerance_retries: 10


##  Controller fan - FAN2
[controller_fan controller_fan]
pin: PE6
kick_start_time: 0.5
heater: heater_bed

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_<MCU_SERIAL>-if00

[input_shaper]
#shaper_freq_x: 71.2 #Hz
#shaper_type_x: 3hump_ei 
#shaper_freq_y: 30.4
#shaper_type_y: mzv

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[gcode_arcs]
resolution: 0.5
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800
# After 30 min idle: heaters off now, motors off 90 min later (2 h total) unless the
# printer was used again. Keeping motors on preserves homing/QGL between prints.
gcode:
    TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=_DELAYED_MOTORS_OFF DURATION=5400

[homing_override]
axes: xyz
gcode:
    # Sensorless XY homing: low current, stall flag settle time, back-off between axes.
    # SGTHRS comes from driver_SGTHRS in the [tmc2209] sections (nothing overrides it at runtime).
    {% set HOME_CUR = 0.8 %}
    {% set x_run = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set y_run = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # Lift the nozzle before moving XY, only if Z position is unknown
    # If Z is already homed and near the top, come down first: the tight cable chain
    # at full height can make sensorless X/Y homing stall early.
    {% if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z > 150 %}
        G90
        G0 Z150 F900
    {% endif %}

    {% if home_all and 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G0 Z10 F600
        SET_KINEMATIC_POSITION SET_HOMED=none CLEAR_HOMED=Z
    {% endif %}
    G90

    {% if home_all or 'X' in params %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P2000
        G28 X
        G0 X290 F3600
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run}
    {% endif %}

    {% if home_all or 'Y' in params %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
        G4 P2000
        G28 Y
        G0 Y290 F3600
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run}
    {% endif %}

    {% if home_all or 'Z' in params %}
        G0 X150 Y150 F6000
        G28 Z
        G0 Z20 F600
    {% endif %}

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

gantry_corners:
   -60,-10
   360,370
##  Probe points
points:
   50,50
   50,250
   250,250
   250,50

speed: 75
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0150
max_adjust: 10

[bed_mesh]
##----------------------300mm build-------------------------------------
speed: 500
horizontal_move_z: 10
adaptive_margin: 15
mesh_min: 25, 25
mesh_max: 275, 275
zero_reference_position: 150,175 # probe XY when Z homes (nozzle at 150,150, probe y_offset 25)
fade_start: 0.6
fade_end: 10.0
probe_count: 9,9 # ~31 mm spacing; adaptive meshes keep this spacing
algorithm: bicubic
##--------------------------------------------------------------------


########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PG4, EXP1_3=PD11, EXP1_5=PG2, EXP1_7=PG6, EXP1_9=<GND>,
    EXP1_2=PA8, EXP1_4=PD10, EXP1_6=PG3, EXP1_8=PG7, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PG10, EXP2_5=PF11, EXP2_7=PF12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB12, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=PF13
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "spi2"

##  Mini12864 (FYSETC / BTT) on EXP1/EXP2
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2
menu_timeout: 40

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4

[output_pin beeper]
pin: EXP1_1

