[bed_mesh]
##----------------------350mm build-------------------------------------
speed: 225
horizontal_move_z: 2         # eddy (was 10 for the inductive probe)
adaptive_margin: 15
mesh_min: 25, 25            # (X 80 for a few hours on 2026-11-14: misdiagnosed, the scan failures were not position related)
mesh_max: 315, 315          # was 325: at the back-right corner (probe 325,325) the eddy gave only
                            # "Amplitude Low/High" warnings and the scan failed twice (2026-11-11, after the EBB rebuild)
zero_reference_position: 175,200 # eddy XY when Z homes (nozzle at 175,175, eddy y_offset 25)
fade_start: 0.6
fade_end: 10.0
probe_count: 20,20          # ~15 mm spacing (was 31,31 = 10 mm for rapid_scan): with mesh_method "scan" (stop at each
                            # point) a 5x5 plate is ~1.5 min instead of ~4; adaptive meshes keep this spacing
algorithm: bicubic
##--------------------------------------------------------------------
