<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 2; rx: 8; }
      .boxfut { fill: #ffffff; stroke: #333; stroke-width: 2; stroke-dasharray: 8 5; }
      .title { font-size: 20px; font-weight: bold; fill: #111; }
      .sub { font-size: 14px; fill: #444; }
      .lbl { font-size: 13px; fill: #222; }
      .small { font-size: 12px; fill: #555; }
      .panel { font-size: 24px; font-weight: bold; fill: #111; }
      .on { fill: #1b7f3b; font-weight: bold; }
      .off { fill: #b02a2a; font-weight: bold; }
      .w24 { stroke: #d62728; stroke-width: 4; fill: none; }
      .wgnd { stroke: #222; stroke-width: 4; fill: none; }
      .wh { stroke: #e6b800; stroke-width: 4; fill: none; }
      .wl { stroke: #2ca02c; stroke-width: 4; fill: none; }
      .usb { stroke: #1f77b4; stroke-width: 4; fill: none; }
      .usbold { stroke: #999; stroke-width: 3; fill: none; stroke-dasharray: 6 4; }
      .sig { stroke: #7f3fbf; stroke-width: 3; fill: none; }
      .term { fill: #fff3c4; stroke: #b08900; stroke-width: 1.5; }
      .note { fill: #f5f7fa; stroke: #c9d1db; stroke-width: 1.5; }
      .warn { fill: #fff4f0; stroke: #e0a080; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1180" fill="#fbfbfb"/>
  <text x="40" y="44" font-size="28" font-weight="bold" fill="#111">Voron 2.4 CAN wiring: printer Pi → USB-CAN adapter → umbilical → EBB (+ Eddy Duo)</text>
  <text x="40" y="70" class="sub">CAN bus 1 Mbit/s (can0). Exactly two 120 Ω terminators, one at each end of the bus. Twist CAN-H with CAN-L along the umbilical.</text>

  <!-- legend -->
  <g transform="translate(1040,92)">
    <rect x="0" y="0" width="520" height="66" class="note" rx="6"/>
    <line x1="14" y1="22" x2="54" y2="22" class="w24"/><text x="62" y="27" class="lbl">+24 V</text>
    <line x1="130" y1="22" x2="170" y2="22" class="wgnd"/><text x="178" y="27" class="lbl">GND</text>
    <line x1="240" y1="22" x2="280" y2="22" class="wh"/><text x="288" y="27" class="lbl">CAN-H</text>
    <line x1="370" y1="22" x2="410" y2="22" class="wl"/><text x="418" y="27" class="lbl">CAN-L</text>
    <line x1="14" y1="48" x2="54" y2="48" class="usb"/><text x="62" y="53" class="lbl">USB</text>
    <line x1="130" y1="48" x2="170" y2="48" class="sig"/><text x="178" y="53" class="lbl">probe signal</text>
    <rect x="290" y="38" width="24" height="18" class="term" rx="3"/><text x="320" y="53" class="lbl">120 Ω terminator</text>
  </g>

  <!-- ================================================================ PANEL 1 -->
  <text x="40" y="132" class="panel">1. Now — EBB on CAN, inductive probe kept on the EBB</text>
  <rect x="30" y="170" width="1540" height="430" fill="none" stroke="#ccc" stroke-width="1.5" rx="10"/>

  <!-- PSU -->
  <rect x="60" y="200" width="200" height="90" class="box"/>
  <text x="80" y="232" class="title">24 V PSU</text>
  <text x="80" y="256" class="sub">frame electronics bay</text>
  <text x="80" y="276" class="small">feeds umbilical 24 V / GND</text>

  <!-- Pi -->
  <rect x="60" y="340" width="200" height="120" class="box"/>
  <text x="80" y="372" class="title">Printer Pi</text>
  <text x="80" y="396" class="sub">YEG2-4 · 192.168.5.240</text>
  <text x="80" y="416" class="small">Klipper · can0 @ 1 Mbit/s</text>
  <text x="80" y="436" class="small">(systemd-networkd)</text>

  <!-- SKR Pro -->
  <rect x="60" y="500" width="200" height="80" class="box"/>
  <text x="80" y="530" class="title">SKR Pro v1.2</text>
  <text x="80" y="552" class="small">unchanged: USB to Pi</text>
  <path d="M160,500 L160,460" class="usbold"/>

  <!-- adapter -->
  <rect x="340" y="330" width="250" height="140" class="box"/>
  <text x="360" y="362" class="title">USB-CAN adapter</text>
  <text x="360" y="384" class="sub">xCAN · STM32F072C8T6</text>
  <text x="360" y="404" class="small">candleLight (gs_usb) · 1d50:606f</text>
  <rect x="360" y="420" width="44" height="30" class="term" rx="4"/><text x="365" y="440" class="small">120Ω</text>
  <text x="412" y="440" class="lbl on">ON (bus end #1)</text>
  <path d="M260,400 L340,400" class="usb"/>
  <text x="272" y="392" class="small">USB</text>

  <!-- junction at frame: PSU power + adapter CAN -> umbilical -->
  <rect x="660" y="230" width="150" height="260" class="box"/>
  <text x="675" y="258" class="title">Umbilical</text>
  <text x="675" y="278" class="title">frame end</text>
  <text x="675" y="300" class="small">terminal block /</text>
  <text x="675" y="316" class="small">connector</text>
  <circle cx="660" cy="350" r="5" fill="#d62728"/><circle cx="660" cy="380" r="5" fill="#222"/>
  <circle cx="660" cy="420" r="5" fill="#e6b800"/><circle cx="660" cy="450" r="5" fill="#2ca02c"/>
  <text x="675" y="355" class="lbl">24 V</text><text x="675" y="385" class="lbl">GND</text>
  <text x="675" y="425" class="lbl">CAN-H</text><text x="675" y="455" class="lbl">CAN-L</text>
  <path d="M260,230 L620,230 L620,350 L660,350" class="w24"/>
  <path d="M260,260 L605,260 L605,380 L660,380" class="wgnd"/>
  <path d="M590,420 L660,420" class="wh"/>
  <path d="M590,450 L660,450" class="wl"/>
  <path d="M590,380 L605,380" class="wgnd" stroke-dasharray="5 4"/>
  <text x="470" y="520" class="small">adapter GND → bus GND (common ground)</text>
  <text x="470" y="536" class="small">if the adapter has a GND terminal</text>

  <!-- umbilical cable -->
  <path d="M810,350 L1040,350" class="w24"/>
  <path d="M810,380 L1040,380" class="wgnd"/>
  <path d="M810,420 C850,412 870,428 900,420 C930,412 950,428 980,420 L1040,420" class="wh"/>
  <path d="M810,450 C850,458 870,442 900,450 C930,458 950,442 980,450 L1040,450" class="wl"/>
  <text x="840" y="330" class="sub">4-wire umbilical</text>
  <text x="840" y="485" class="small">CAN-H / CAN-L twisted pair</text>

  <!-- EBB -->
  <rect x="1040" y="290" width="270" height="230" class="box"/>
  <text x="1060" y="322" class="title">BTT EBBCan (EBB36/42)</text>
  <text x="1060" y="344" class="sub">STM32G0B1 · firmware ebb-can</text>
  <text x="1060" y="364" class="small">CAN on PB0/PB1 · [mcu EBBCan]</text>
  <text x="1060" y="380" class="small">canbus_uuid from canbus_query.py</text>
  <text x="1060" y="404" class="lbl">CAN in: 24V · GND · H · L</text>
  <rect x="1060" y="420" width="44" height="30" class="term" rx="4"/><text x="1065" y="440" class="small">120Ω</text>
  <text x="1112" y="440" class="lbl on">ON (bus end #2)</text>
  <text x="1060" y="476" class="lbl">USB: unplugged after flashing</text>
  <text x="1060" y="496" class="small">(only for DFU firmware updates)</text>

  <!-- inductive probe -->
  <rect x="1380" y="300" width="170" height="140" class="box"/>
  <text x="1395" y="330" class="title">Inductive</text>
  <text x="1395" y="352" class="title">probe</text>
  <text x="1395" y="376" class="small">stays on EBB probe</text>
  <text x="1395" y="392" class="small">port, as now</text>
  <text x="1395" y="414" class="small">[probe] pin:</text>
  <text x="1395" y="430" class="small">~!EBBCan:PB9</text>
  <path d="M1310,370 L1380,370" class="sig"/>

  <text x="1040" y="570" class="small">No Klipper change for the probe: it moves to CAN with the EBB.</text>

  <!-- ================================================================ PANEL 2 -->
  <text x="40" y="652" class="panel">2. Later — Eddy Duo added on the same CAN pair, inductive probe removed</text>
  <rect x="30" y="670" width="1540" height="330" fill="none" stroke="#ccc" stroke-width="1.5" rx="10"/>

  <!-- compact left side -->
  <rect x="60" y="720" width="250" height="110" class="box"/>
  <text x="80" y="752" class="title">Pi + adapter</text>
  <text x="80" y="776" class="sub">as in panel 1</text>
  <rect x="80" y="790" width="44" height="28" class="term" rx="4"/><text x="85" y="809" class="small">120Ω</text>
  <text x="132" y="809" class="lbl on">ON (end #1)</text>

  <rect x="380" y="720" width="150" height="110" class="box"/>
  <text x="395" y="752" class="title">Umbilical</text>
  <text x="395" y="776" class="sub">+ 24 V PSU</text>
  <text x="395" y="796" class="small">as in panel 1</text>
  <path d="M310,780 L380,780" class="wh"/><path d="M310,800 L380,800" class="wl"/>

  <path d="M530,750 L760,750" class="w24"/>
  <path d="M530,770 L760,770" class="wgnd"/>
  <path d="M530,790 L760,790" class="wh"/>
  <path d="M530,810 L760,810" class="wl"/>

  <!-- toolhead tee -->
  <rect x="760" y="730" width="150" height="100" class="box"/>
  <text x="775" y="760" class="title">Toolhead</text>
  <text x="775" y="782" class="title">split</text>
  <text x="775" y="804" class="small">short stubs,</text>
  <text x="775" y="820" class="small">keep &lt; ~10 cm</text>

  <!-- EBB -->
  <rect x="1000" y="700" width="260" height="140" class="box"/>
  <text x="1020" y="732" class="title">BTT EBBCan</text>
  <text x="1020" y="756" class="sub">24V · GND · H · L</text>
  <rect x="1020" y="772" width="44" height="28" class="term" rx="4"/><text x="1025" y="791" class="small">120Ω</text>
  <text x="1072" y="791" class="lbl off">OFF (jumper removed)</text>
  <text x="1020" y="822" class="small">probe port now empty</text>
  <path d="M910,750 L1000,750" class="w24"/>
  <path d="M910,765 L1000,765" class="wgnd"/>
  <path d="M910,780 L1000,780" class="wh"/>
  <path d="M910,795 L1000,795" class="wl"/>

  <!-- Eddy -->
  <rect x="1000" y="860" width="260" height="125" class="boxfut"/>
  <text x="1020" y="892" class="title">BTT Eddy Duo</text>
  <text x="1020" y="914" class="sub">RP2040 · switch set to CAN</text>
  <text x="1020" y="932" class="small">CAN firmware: RX gpio4, TX gpio5</text>
  <rect x="1020" y="944" width="44" height="28" class="term" rx="4"/><text x="1025" y="963" class="small">120Ω</text>
  <text x="1072" y="963" class="lbl on">ON (end #2)</text>
  <path d="M880,830 L880,890 L1000,890" class="wh"/>
  <path d="M895,830 L895,905 L1000,905" class="wl"/>
  <path d="M850,830 L850,920 L1000,920" class="wgnd"/>
  <path d="M835,830 L835,935 L940,935" class="w24" stroke-dasharray="6 4"/>
  <text x="790" y="960" class="small">power: see warning →</text>

  <!-- warning -->
  <rect x="1290" y="700" width="260" height="285" class="warn" rx="8"/>
  <text x="1305" y="728" font-size="16" font-weight="bold" fill="#a33">Check before wiring Eddy</text>
  <text x="1305" y="754" class="small">Eddy Duo uses a 4-pin, 1.5 mm</text>
  <text x="1305" y="770" class="small">pitch connector. Confirm its pin</text>
  <text x="1305" y="786" class="small">order and the supply voltage it</text>
  <text x="1305" y="802" class="small">expects on that connector (24 V</text>
  <text x="1305" y="818" class="small">or 5 V) against BTT's pinout /</text>
  <text x="1305" y="834" class="small">silkscreen when it arrives.</text>
  <text x="1305" y="862" class="small">Only CAN-H, CAN-L and GND are</text>
  <text x="1305" y="878" class="small">certain to be shared with the</text>
  <text x="1305" y="894" class="small">EBB; power is drawn dashed.</text>
  <text x="1305" y="922" class="small">Flash its CAN firmware while it</text>
  <text x="1305" y="938" class="small">is still in USB mode (DFU is</text>
  <text x="1305" y="954" class="small">easier than over CAN).</text>

  <!-- footer notes -->
  <rect x="30" y="1020" width="1540" height="140" class="note" rx="8"/>
  <text x="50" y="1048" font-size="16" font-weight="bold" fill="#222">Checklist</text>
  <text x="50" y="1074" class="lbl">• Termination: exactly two 120 Ω, at the adapter and at the far end. With the bus powered off, CAN-H to CAN-L should measure about 60 Ω.</text>
  <text x="50" y="1096" class="lbl">• Moving 120 Ω from the EBB to the Eddy Duo is the only jumper change between panels 1 and 2.</text>
  <text x="50" y="1118" class="lbl">• Connector pin order on each board: follow the silkscreen (24V / GND / H / L), not wire position. Swapped H/L gives no nodes in canbus_query.py.</text>
  <text x="50" y="1140" class="lbl">• Steps for the EBB: firmware/ebb-can.md. Adapter: firmware/candlelight/README.md.</text>
</svg>
