#####################################################################
#   Edmonton-only macros. Print flow, homing helpers, levelling, soak, park and
#   filament park are SHARED: shared/print_flow.cfg (docs/printer-parity.md)
#####################################################################
[gcode_macro COLD_PULL]
description: Clean the nozzle: heat, push filament through, cool, then pull it out (FORCE_MOVE)
#   COLD_PULL [HOT=220] [PULL_TEMP=90] [PUSH=15] [PULL=50] [SPEED=10]
#   HOT: temp to melt and push PUSH mm through. PULL_TEMP: the nozzle cools to this before the
#   pull (PLA/wood ~90, PETG ~110, ASA ~120); the plastic should be solid but still pliable.
#   PULL mm come out at SPEED mm/s in one firm move. The Clockwork 2 has no idler lever, so
#   the motor does the pull; FORCE_MOVE works below min_extrude_temp (170C) for that move only.
#   Afterwards look at the tip: a clean cone the shape of the nozzle means it is clear; dark
#   specks or a ragged end mean repeat. Cut the tip off and reload before printing.
gcode:
    {% if printer.print_stats.state in ("printing", "paused") %}
        {action_raise_error("COLD_PULL: not during a print")}
    {% endif %}
    {% set HOT = params.HOT|default(220)|int %}
    {% set PULL_TEMP = params.PULL_TEMP|default(90)|int %}
    {% set PUSH = params.PUSH|default(15)|float %}
    {% set PULL = params.PULL|default(50)|float %}
    {% set SPEED = params.SPEED|default(10)|float %}
    {% if HOT < 170 or HOT > 280 or PULL_TEMP < 40 or PULL_TEMP >= HOT %}
        {action_raise_error("COLD_PULL: need 170 <= HOT <= 280 and 40 <= PULL_TEMP < HOT")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=COLD_PULL
        G90
        G0 Z{[printer.toolhead.position.z, 50]|max} F1200   ; room under the nozzle to see the tip
        G0 X{printer.toolhead.axis_maximum.x / 2} Y40 F12000
        RESTORE_GCODE_STATE NAME=COLD_PULL
    {% endif %}
    RESPOND MSG="Cold pull: heating to {HOT}C"
    M109 S{HOT}
    M83
    G1 E{PUSH} F120                  ; 2 mm/s: fill the nozzle with fresh plastic
    M400
    RESPOND MSG="Cold pull: cooling to {PULL_TEMP}C (part fan on)"
    M104 S0
    M106 S255
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PULL_TEMP}
    M106 S0
    M400
    FORCE_MOVE STEPPER=extruder DISTANCE=-{PULL} VELOCITY={SPEED}
    SAVE_VARIABLE VARIABLE=filament_parked VALUE=0   ; reloaded by hand to the nozzle afterwards
    RESPOND MSG="Cold pull done (pulled at {PULL_TEMP}C): check the tip, cut it off and reload. Repeat until it comes out clean."

[gcode_macro WOOD_GRAIN]
description: Wood-grain colour bands: a new random nozzle temp every BAND mm of height (wood PLA)
#   WOOD_GRAIN [MIN=205] [MAX=230] [BAND=0.8] [START=0.6]   switch on for this print
#   WOOD_GRAIN OFF=1                                        switch off, back to the base temp
#   Wood PLA prints darker when hotter, so bands of different temps look like grain on walls.
#   BAND and START are heights in mm, so bands look the same at 0.1 or 0.2 mm layers; START
#   keeps the first layers at the preset temp for adhesion.
#   Called by the "Voron PLA Wood Oak Grain" filament preset's start G-code; Orca's layer-change
#   G-code calls _WOOD_GRAIN_LAYER every layer (a no-op unless switched on).
#   M104 only (no wait): the heater lags, which softens the band edges. Limits 195-240C;
#   below ~205C long runs of wood PLA jammed (filaments/pla-wood-oak.md).
#   PRINT_START and PRINT_END switch it off, so it never carries into another print.
variable_enabled: 0
variable_tmin: 205
variable_tmax: 230
variable_band: 0.8
variable_next_z: 0
variable_base: 0
gcode:
    {% if params.OFF|default(0)|int %}
        {% if enabled and base > 0 %}
            M104 S{base}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=enabled VALUE=0
        RESPOND MSG="Wood grain: off"
    {% else %}
        {% set tmin = [params.MIN|default(205)|int, 195]|max %}
        {% set tmax = [params.MAX|default(230)|int, 240]|min %}
        {% set band = [params.BAND|default(0.8)|float, 0.1]|max %}
        {% set start = [params.START|default(0.6)|float, 0.0]|max %}
        {% if tmax < tmin %}
            {action_raise_error("WOOD_GRAIN: MAX must be >= MIN (limits 195-240C)")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=tmin VALUE={tmin}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=tmax VALUE={tmax}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=band VALUE={band}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=next_z VALUE={start}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=base VALUE={printer.extruder.target|int}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=enabled VALUE=1
        RESPOND MSG="Wood grain: {tmin}-{tmax}C, a new temp every {band} mm from Z {start}"
    {% endif %}

[gcode_macro _WOOD_GRAIN_LAYER]
#   Orca layer-change G-code: _WOOD_GRAIN_LAYER Z=[layer_z]
gcode:
    {% set g = printer["gcode_macro WOOD_GRAIN"] %}
    {% set z = params.Z|default(0)|float %}
    {% if g.enabled and z >= g.next_z - 0.001 %}
        {% set t = range(g.tmin, g.tmax + 1)|random %}
        M104 S{t}
        M117 Grain {t}C (Z {z})
        {% set steps = ((z - g.next_z + 0.001) / g.band)|int + 1 %}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=next_z VALUE={(g.next_z + g.band * steps)|round(3)}
    {% endif %}

[delayed_gcode _DELAYED_MOTORS_OFF]
gcode:
    # Only if nothing happened since the idle timeout fired (state still Idle) and no print is running
    {% if printer.idle_timeout.state == "Idle" and printer.print_stats.state not in ["printing", "paused"] %}
        M84
        RESPOND MSG="Motors off after 2 hours idle"
    {% endif %}

[gcode_macro PROBE_DRIFT_TEST]
description: Z drift while the bed heats and soaks: PROBE_DRIFT_TEST BED=55 MINUTES=25 INTERVAL=60 NOZZLE=150
#   Homes cold (like PRINT_START), then probes the Z homing spot every INTERVAL seconds while
#   the bed heats. Z motors hold position, so any change in the result is drift of bed, frame
#   and probe. Results are printed as "DRIFT ..." lines. PROBE_DRIFT_STOP ends it early.
gcode:
    {% set BED = params.BED|default(55)|int %}
    {% set NOZZLE = params.NOZZLE|default(150)|int %}
    {% set INTERVAL = params.INTERVAL|default(60)|int %}
    SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=ticks_left VALUE={(params.MINUTES|default(25)|int * 60) // INTERVAL}
    SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=interval VALUE={INTERVAL}
    SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=elapsed VALUE=0
    G28
    G90
    G1 X150 Y150 Z10 F6000         ; probe over the Z homing spot (150,175)
    PROBE
    _DRIFT_LOG BASELINE=1
    G1 Z10 F600
    M140 S{BED}
    M104 S{NOZZLE}
    RESPOND MSG="Drift test: bed {BED}C, nozzle {NOZZLE}C. PROBE_DRIFT_STOP ends it."
    UPDATE_DELAYED_GCODE ID=_DRIFT_TICK DURATION={INTERVAL}

[gcode_macro _DRIFT_STATE]
variable_ticks_left: 0
variable_interval: 60
variable_elapsed: 0
variable_baseline: 0.0
gcode:

[gcode_macro _DRIFT_LOG]
gcode:
    {% set s = printer["gcode_macro _DRIFT_STATE"] %}
    {% set z = printer.probe.last_probe_position.z %}
    {% if params.BASELINE %}
        SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=baseline VALUE={z}
        {% set base = z %}
    {% else %}
        {% set base = s.baseline %}
    {% endif %}
    RESPOND MSG="DRIFT t={s.elapsed}s bed={printer.heater_bed.temperature|round(1)} nozzle={printer.extruder.temperature|round(0)|int} z={'%.4f' % z} dz={'%+.4f' % (z - base)}"

[delayed_gcode _DRIFT_TICK]
gcode:
    {% set s = printer["gcode_macro _DRIFT_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=elapsed VALUE={s.elapsed + s.interval}
    G90
    PROBE
    _DRIFT_LOG
    G1 Z10 F600
    {% if s.ticks_left > 1 %}
        SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=ticks_left VALUE={s.ticks_left - 1}
        UPDATE_DELAYED_GCODE ID=_DRIFT_TICK DURATION={s.interval}
    {% else %}
        PROBE_DRIFT_STOP
    {% endif %}

[gcode_macro PROBE_DRIFT_STOP]
description: End PROBE_DRIFT_TEST and turn the heaters off
gcode:
    UPDATE_DELAYED_GCODE ID=_DRIFT_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=_DRIFT_STATE VARIABLE=ticks_left VALUE=0
    TURN_OFF_HEATERS
    RESPOND MSG="Drift test finished"

[gcode_macro MESH_DRIFT_CHECK]
description: Soak like PRINT_START, then probe the zero reference before and after a full mesh: MESH_DRIFT_CHECK BED=60 SOAK=10 PARK_Z=3 NOZZLE=150
#   Blocking (G4) soak; emergency stop still works. The before/after difference at the same
#   spot is how far the probe drifted while meshing. Mesh is kept as profile check.
gcode:
    {% set BED = params.BED|default(60)|int %}
    {% set SOAK = params.SOAK|default(10)|int %}
    {% set PARK_Z = params.PARK_Z|default(3)|float %}
    {% set NOZZLE = params.NOZZLE|default(150)|int %}
    M140 S{BED}
    M104 S{NOZZLE}
    G28
    G90
    G1 X150 Y150 F6000
    G1 Z{PARK_Z} F600
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 1}
    M109 S{NOZZLE}
    RESPOND MSG="Mesh drift check: soaking {SOAK} min at Z{PARK_Z}"
    G4 P{SOAK * 60000}
    QUAD_GANTRY_LEVEL
    G28 Z
    G1 X150 Y150 Z10 F6000         ; probe over the zero reference (150,175)
    PROBE
    _MESH_DRIFT_MARK
    BED_MESH_CALIBRATE PROFILE=check
    G1 X150 Y150 Z10 F6000
    PROBE
    _MESH_DRIFT_REPORT
    G1 Z10 F600

[gcode_macro _MESH_DRIFT_MARK]
variable_z: 0.0
gcode:
    SET_GCODE_VARIABLE MACRO=_MESH_DRIFT_MARK VARIABLE=z VALUE={printer.probe.last_probe_position.z}

[gcode_macro _MESH_DRIFT_REPORT]
gcode:
    {% set before = printer["gcode_macro _MESH_DRIFT_MARK"].z %}
    {% set after = printer.probe.last_probe_position.z %}
    RESPOND MSG="MESH DRIFT before={'%.4f' % before} after={'%.4f' % after} drift={'%+.4f' % (after - before)}"
