# BTT Eddy Duo on USB (DIP switch USB). Firmware: firmware-eddy-usb.config (RP2040, no bootloader,
# GENERIC_03H CLKDIV 4, USB). Replaces the inductive probe on PG15. Moves to CAN with the umbilical.
# Included from printer.cfg 2026-11-03.
# Calibration order (bigtreetech/Eddy, Klipper docs/Eddy_Probe.md):
#   1. LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy   (sensor ~20mm over the bed centre), SAVE_CONFIG
#   2. PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy  (paper test at the centre), SAVE_CONFIG
#   3. tap_threshold (PROBE METHOD=tap), then _EDDY home_method "tap"
#   4. thermal drift: TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET=56 STEP=4

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_<MCU_SERIAL>-if00

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0             # same as the inductive probe
y_offset: 25.0          # same as the inductive probe
descend_z: 0.5
# Default probing (PROBE, QUAD_GANTRY_LEVEL): 3 readings per point, median. One reading with a
# 100C bed varies ~0.01 mm, more than QGL can level to (2026-11-03). Scans are not affected.
samples: 3
samples_result: median
samples_tolerance: 0.030      # hot-bed readings spread ~0.012 mm; 0.010 failed QGL (2026-11-03). The median handles outliers
samples_tolerance_retries: 3
#tap_threshold:         # set by PROBE_EDDY_CURRENT_TAP_CALIBRATE

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# Homing correction and tap macros (_EDDY, SET_Z_FROM_PROBE, _TAP_Z) are SHARED:
# shared/print_flow.cfg. G28 Z with an eddy probe has an offset error; probing does not.
