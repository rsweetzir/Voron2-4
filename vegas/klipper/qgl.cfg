##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
gantry_corners:            # stock Voron 2.4 350 (was -2,-10: X min wrong, corrections overshot, 2026-11-03)
   -60,-10
   410,420
##  Probe points
points:                    # nozzle positions; the eddy (y_offset 25) probes 50 mm in from every edge
   50,25
   50,275
   300,275
   300,25

speed: 300                 # XY travel between points (as Edmonton)
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.015    # eddy repeatability with a 100C bed is ~0.01 mm; 0.0075 never settled (2026-11-03), as Edmonton
max_adjust: 20

# QUAD_GANTRY_LEVEL / SMART_QGL / QGL / G32 macros are SHARED: shared/print_flow.cfg
