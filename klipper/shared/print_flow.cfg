#####################################################################################
#  SHARED by both printers (Edmonton and Las Vegas). Do not edit on a printer:
#  edit klipper/shared/ in the repo and deploy to both (tools/deploy_config.py).
#  Printer-specific values come from [gcode_macro _PRINTER_SETTINGS] in each printer's
#  printer_settings.cfg. See docs/printer-parity.md.
#
#  Print flow (PRINT_START): home (contactless Z) -> park over the bed centre at SOAK_PARK_Z
#  -> wait for the bed -> non-blocking soak (gantry levelled half-way through) ->
#  _PRINT_START_FINISH: level if needed, one nozzle tap at the bed centre, adaptive eddy
#  scan, nozzle heat, KAMP purge -> print continues from where the purge ended.
#  Z is homed once (contactless) and tapped once; no other G28 Z in the flow.
#####################################################################################

# ---------------------------------------------------------------- eddy Z helpers
[gcode_macro _EDDY]
variable_home_method: "tap"   # Z0 = nozzle contact (tap); "automatic" = contactless eddy reading
variable_skip_tap: 0          # 1 = the NEXT G28 Z corrects Z contactless (no warm nozzle); one-shot,
                              # set by PRINT_START for its first homing; the homing override resets it
gcode:

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
    # tap_z_adjust (printer_settings): how far a tap reads above the real bed contact. A tap
    # reports where the nozzle leaves the bed on the lift, which can sit above true contact.
    {% set adj = printer["gcode_macro _PRINTER_SETTINGS"].tap_z_adjust if params.METHOD|default("")|lower == "tap" else 0 %}
    {% set Z = printer.toolhead.position.z %}
    SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z + adj}

[gcode_macro SET_Z_FROM_PROBE]
description: Correct Z by one probe at the current XY (tap by default). The caller lifts afterwards.
gcode:
    {% set METHOD = params.METHOD|default(printer["gcode_macro _EDDY"].home_method) %}
    G90
    G0 Z3 F600                     ; from descend_z (0.5) or any height: room for the probe
    PROBE METHOD={METHOD}
    _RELOAD_Z_OFFSET_FROM_PROBE METHOD={METHOD}

[gcode_macro _TAP_Z]
description: Z0 by one nozzle tap at the bed centre (Z already homed), instead of a full G28 Z
gcode:
    {% set s = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% if 'xyz' in printer.toolhead.homed_axes %}
        G90
        G0 Z{[printer.toolhead.position.z, 10]|max} F600
        G0 X{s.center_x} Y{s.center_y} F12000
        SET_Z_FROM_PROBE
        G0 Z10 F600
    {% else %}
        G28                        ; not homed (motors were off): the homing override taps
    {% endif %}

# ---------------------------------------------------------------- homing and levelling
[gcode_macro SMART_HOME]
gcode:
    {% if printer.toolhead.homed_axes == "xyz" %}
        M117 Printer is already homed
    {% else %}
        M117 Printer needs homed...
        G28
    {% endif %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # Coarse pass only when not levelled since the motors were last on, then the fine pass.
    # No G28 Z between them: QGL keeps the gantry's average height, and the fine pass probes
    # from qgl_fine_z (10 mm), well above any coarse correction (0.4-1.2 mm seen).
    {% set s = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z={s.qgl_fine_z}

[gcode_macro SMART_QGL]
gcode:
    {% if not printer.quad_gantry_level.applied %}
        SMART_HOME
        M117 Printer needs leveling...
        QUAD_GANTRY_LEVEL
    {% else %}
        M117 Printer is already leveled
    {% endif %}
    _TAP_Z                         ; Z0 at the current bed temperature

[gcode_macro QGL]
description: Home if needed, level the gantry if needed, tap Z
gcode:
    SMART_QGL

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    SMART_QGL
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro PARK]
gcode:
    # Park at the back, 50mm above the current height (max 200mm, never lower).
    # Not Y max: that is the frame (sensorless end stop); resting there false-triggers X homing.
    {% set th = printer.toolhead %}
    {% set z = [[th.position.z + 50, 200]|min, th.position.z]|max %}
    G90
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 10} Z{z} F6000

[gcode_macro BED_LVL_MESH]
description: Full-bed mesh at 100C saved as 'default' (run HEAT_SOAK_START first for a full soak)
gcode:
    M190 S100
    SMART_QGL
    BED_MESH_CALIBRATE PROFILE=default METHOD=automatic
    SAVE_CONFIG

# ---------------------------------------------------------------- cancel
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    _SOAK_CANCEL
    {% if 'xyz' in printer.toolhead.homed_axes %}
        PARK
    {% endif %}
    {% if printer.extruder.can_extrude %}
        G91
        G1 E-2 F2700               ; retract only if hot enough (cold retract errors and aborted the cancel)
        G90
    {% endif %}
    TURN_OFF_HEATERS
    SET_SKEW CLEAR=1
    CLEAR_PAUSE
    BASE_CANCEL_PRINT

[gcode_macro _SOAK_CANCEL]
description: Stop a running heat soak and an unfinished print start
gcode:
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=finish_pending VALUE=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0

# ---------------------------------------------------------------- print start
# Bed temperature history: one sample per minute (whole degrees C), newest last, last 60 min.
# PRINT_START uses it to shorten the heat soak when the bed has already been warm.
[gcode_macro _SOAK_TRACKER]
variable_history: []
gcode:

[delayed_gcode _SOAK_TICK]
initial_duration: 60
gcode:
    {% set hist = (printer["gcode_macro _SOAK_TRACKER"].history + [printer.heater_bed.temperature|round|int])[-60:] %}
    SET_GCODE_VARIABLE MACRO=_SOAK_TRACKER VARIABLE=history VALUE=[{hist|join(',')}]
    UPDATE_DELAYED_GCODE ID=_SOAK_TICK DURATION=60

[gcode_macro PRINT_START]
#   Slicer: PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single] FILAMENT=[filament_type]
#   Heats and homes, then (if needed) runs a NON-BLOCKING heat soak: the print is paused and
#   a 10s timer counts down, so Cancel and other commands keep working. When the soak ends
#   the timer runs _PRINT_START_FINISH (QGL, tap, mesh, nozzle heat, purge) and resumes.
#   HEAT_SOAK_SKIP ends the soak early.
#   PREHEAT= nozzle temp for the tap (default tap_temp; tap_temp_hard for ASA/ABS/PC/PA or
#   beds >= 90C: their residue stays hard at 150C and the tap lands on it). The nozzle stays
#   off during the soak (no heat creep) and warms ~90 s before the end.
#   PARK_Z= nozzle height over the bed centre during the soak (default soak_park_z)
#   SOAK= minutes (default 20 at bed >= 100C, 10 below; SOAK=0 skips); CHAMBER= C to wait for
#   MESH=SAVED loads saved_mesh instead of scanning; SKIP_BOUNDS=1 skips _CHECK_PRINT_BOUNDS
gcode:
    {% set s = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% if params.SKIP_BOUNDS|default(0)|int == 0 %}
        _CHECK_PRINT_BOUNDS        ; stops the print here, heaters still off, if skew pushes it out of range
    {% endif %}
    {% if "gcode_macro WOOD_GRAIN" in printer %}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=enabled VALUE=0   ; filament start G-code may switch it on
    {% endif %}
    {% set BED = params.BED|default(100)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(240)|int %}
    {% set FILAMENT = params.FILAMENT|default("Unknown")|string %}
    {% set hard = FILAMENT|upper in ["ASA", "ABS", "ASA_OVERTURE", "PC", "PA"] or BED >= 90 %}
    {% set PREHEAT = params.PREHEAT|default(s.tap_temp_hard if hard else s.tap_temp)|int %}
    {% set PARK_Z = params.PARK_Z|default(s.soak_park_z)|float %}
    {% set SOAK_MIN = params.SOAK|default(20 if BED >= 100 else 10)|int %}
    {% set has_chamber = "temperature_sensor chamber" in printer %}
    {% set CHAMBER = params.CHAMBER|default(s.chamber_temp if BED >= 100 else 0)|int %}
    {% set ns = namespace(warm=0, hot=0, warm_run=True, hot_run=True) %}
    {% for t in printer["gcode_macro _SOAK_TRACKER"].history|reverse %}
        {% if ns.warm_run and t >= BED * 0.8 %}{% set ns.warm = ns.warm + 1 %}{% else %}{% set ns.warm_run = False %}{% endif %}
        {% if ns.hot_run and t >= BED - 2 %}{% set ns.hot = ns.hot + 1 %}{% else %}{% set ns.hot_run = False %}{% endif %}
    {% endfor %}

    {% if "delayed_gcode _DELAYED_MOTORS_OFF" in printer %}
        UPDATE_DELAYED_GCODE ID=_DELAYED_MOTORS_OFF DURATION=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=finish_pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=extruder VALUE={EXTRUDER}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=preheat VALUE={PREHEAT}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=mesh VALUE='"{params.MESH|default("adaptive")|lower}"'
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=filament VALUE='"{FILAMENT}"'

    M117 {FILAMENT}: heating bed {BED}C
    RESPOND MSG="{FILAMENT} print start: bed {BED}C, nozzle {EXTRUDER}C, tap at {PREHEAT}C"
    M140 S{BED}                    ; start bed heating
    M221 S100                      ; the calibration suite (_CAL_APPLY) leaves its M221 flow set
    FILAMENT_PARK                  ; quick restart with a hot nozzle: tip out of the hot zone
    M104 S0                        ; nozzle stays cold until after the soak
    {% if "fan_generic exhaust_fan" in printer %}
        UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0   ; keep the chamber warm (an exhaust at 100% from a
    {% endif %}                                 ; 90C bed drew cold air over the front, ASA warped)
    SET_SKEW CLEAR=1               ; homing moves must not be skewed (applied again before the mesh)
    SET_GCODE_VARIABLE MACRO=_EDDY VARIABLE=skip_tap VALUE=1   ; this homing: contactless Z (enough to park)
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
        G28 Z                      ; X/Y still homed (Klipper un-homes when motors go off): Z only
    {% else %}
        G28
    {% endif %}
    G90
    G1 X{s.center_x} Y{s.center_y} F6000   ; park over the bed centre (Z was just homed here)
    G1 Z{PARK_Z} F600              ; soak the probe close to the bed
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 1}   ; a hotter bed is not cooled down

    {% if SOAK_MIN > 0 and ns.warm >= SOAK_MIN %}
        RESPOND MSG="Short {FILAMENT} heat soak: bed has been at {(BED * 0.8)|round(1)}C+ (80% of {BED}C) for {ns.warm} min; 1 min to stabilise. HEAT_SOAK_SKIP ends it early."
        _HEAT_SOAK_BEGIN SECONDS=60 BED={BED} CHAMBER={CHAMBER if has_chamber else 0} RESUME_PRINT=1 PARK_Z={PARK_Z}
        PAUSE_BASE                 ; stop reading the file; the soak timer resumes it
    {% elif SOAK_MIN > 0 and ns.hot < SOAK_MIN %}
        {% set left = SOAK_MIN - ns.hot %}
        {% if has_chamber and CHAMBER > 0 %}
            RESPOND MSG="Running {FILAMENT} heat soak: bed {BED}C for {left} min, then until chamber reaches {CHAMBER}C. Cancel works; HEAT_SOAK_SKIP ends it early."
        {% else %}
            RESPOND MSG="Running {FILAMENT} heat soak: bed {BED}C for {left} min. Cancel works; HEAT_SOAK_SKIP ends it early."
        {% endif %}
        _HEAT_SOAK_BEGIN SECONDS={left * 60} BED={BED} CHAMBER={CHAMBER if has_chamber else 0} RESUME_PRINT=1 PARK_Z={PARK_Z}
        PAUSE_BASE                 ; stop reading the file; the soak timer resumes it
    {% else %}
        {% if SOAK_MIN > 0 %}
            RESPOND MSG="Skipping {FILAMENT} heat soak: bed has been at {BED}C for {ns.hot} min"
        {% endif %}
        _PRINT_START_FINISH
    {% endif %}

# QGL, tap, mesh, nozzle heat, purge. finish_pending stays 1 if a step fails (e.g. the eddy scan):
# the print is left paused, and RESUME (_CLIENT_VARIABLE user_resume_macro ->
# _PRINT_START_RECOVER) re-runs this before printing, so it never prints without mesh/purge.
[gcode_macro _PRINT_START_FINISH]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    {% set p = printer["gcode_macro _PRINTER_SETTINGS"] %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=finish_pending VALUE=1
    M104 S{s.preheat}              ; warm the nozzle for the tap while the gantry levels
    {% if not printer.quad_gantry_level.applied %}
        M117 Printer needs leveling...
        QUAD_GANTRY_LEVEL
    {% endif %}
    {% if s.preheat > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s.preheat - 5}
    {% endif %}
    _TAP_Z                         ; one tap at the bed centre (Z is already homed)
    SET_VELOCITY_LIMIT ACCEL=1500  ; mesh/purge accel (the slicer sets its own per feature)
    SET_SKEW XY={p.skew_ac},{p.skew_bd},{p.skew_ad}
    {% if s.mesh == "saved" and p.saved_mesh and p.saved_mesh in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD={p.saved_mesh}  ; stored full-bed eddy scan (no probing)
    {% else %}
        {% if s.mesh == "saved" %}
            RESPOND MSG="MESH=SAVED: no '{p.saved_mesh}' profile stored, scanning instead"
        {% endif %}
        # Klipper native adaptive mesh (object bounds + adaptive_margin); own profile so the
        # full 'default' mesh is never overwritten
        BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=adaptive METHOD=rapid_scan
    {% endif %}
    M117 Heating nozzle...
    M109 S{s.extruder}             ; full nozzle temp only right before purge
    {% set parked = printer.save_variables.variables.filament_parked|default(0)|float %}
    {% set tip = printer.configfile.settings["gcode_macro _kamp_settings"].variable_tip_distance|float %}
    {% if parked > 0 %}
        # Parked filament (FILAMENT_PARK): feed all but the last 5 mm here in short moves (each
        # extrude-only move must stay under max_extrude_only_distance after M221), tip above the
        # melt zone; KAMP's purge feeds the last 5 mm + tip at the purge spot
        RESPOND MSG="Filament parked {parked} mm: reloading it in the purge"
        {% set pre = [parked - 5, 0]|max %}
        M83
        G1 E{pre / 2} F300
        G1 E{pre / 2} F300
        SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=tip_distance VALUE={tip + parked - pre}
    {% endif %}
    VORON_PURGE
    {% if parked > 0 %}
        SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=tip_distance VALUE={tip}
        SAVE_VARIABLE VARIABLE=filament_parked VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=finish_pending VALUE=0
    M117 Printing

[gcode_macro _CHECK_PRINT_BOUNDS]
description: Stop a print whose objects or KAMP purge leave the axis range once skew correction is applied
#   Uses the EXCLUDE_OBJECT_DEFINE outlines (outer wall edge; brim not included) plus MARGIN mm
#   (default 1.0). Bypass with PRINT_START SKIP_BOUNDS=1.
gcode:
    {% set k = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% set side = ((2 * k.skew_ac * k.skew_ac + 2 * k.skew_bd * k.skew_bd - 4 * k.skew_ad * k.skew_ad) ** 0.5) / 2 %}
    {% set c = (k.skew_ac * k.skew_ac - side * side - k.skew_ad * k.skew_ad) / (2 * side * k.skew_ad) %}
    {% set factor = c / ((1 - c * c) ** 0.5) %}   # Klipper calc_skew_factor: tan(90deg - acos(c))
    {% set margin = params.MARGIN|default(1.0)|float %}
    {% set lo = printer.toolhead.axis_minimum %}
    {% set hi = printer.toolhead.axis_maximum %}
    {% set objects = printer.exclude_object.objects %}
    {% if objects|length > 0 %}
        # KAMP Voron purge: a 10 mm square at (object min - purge_margin), clamped to 0
        {% set all = objects|map(attribute='polygon')|sum(start=[]) %}
        {% set pm = printer["gcode_macro _KAMP_Settings"].purge_margin|float %}
        {% set px = [(all|map(attribute=0)|min) - pm, 0]|max %}
        {% set py = [(all|map(attribute=1)|min) - pm, 0]|max %}
        {% set shapes = objects|map(attribute='name')|list + ["KAMP purge"] %}
        {% set polys = objects|map(attribute='polygon')|list + [[[px, py], [px + 10, py], [px + 10, py + 10], [px, py + 10]]] %}
        {% set ns = namespace(msgs=[], over=0, room=999) %}
        {% for poly in polys %}
            {% set is_purge = loop.last %}
            {% set m = 0 if is_purge else margin %}   # purge moves are exact: no brim margin
            {% set xs = poly|map('first')|map('float')|list %}
            {% set sx = [] %}
            {% for pt in poly %}{% set _ = sx.append(pt[0]|float - pt[1]|float * factor) %}{% endfor %}
            {% set ys = poly|map('last')|map('float')|list %}
            {% if not is_purge %}
                {% set ns.room = [ns.room, (sx|min) - m - lo[0], xs|min]|min %}
            {% endif %}
            {% if (sx|max) + m > hi[0] or (sx|min) - m < lo[0] or (ys|max) + m > hi[1] or (ys|min) - m < lo[1] %}
                {% set ns.over = [ns.over, (sx|max) + m - hi[0]]|max %}
                {% set ns.msgs = ns.msgs + ["%s: nozzle X %.1f..%.1f, Y %.1f..%.1f (limits X %.0f..%.0f, Y %.0f..%.0f, margin %.1f)" % (shapes[loop.index0], sx|min, sx|max, ys|min, ys|max, lo[0], hi[0], lo[1], hi[1], m)] %}
            {% endif %}
        {% endfor %}
        {% if ns.msgs %}
            {% set advice = "Rotate the part 180 deg in the slicer so its widest side is at the front (skew adds %.4f mm of X per mm of Y)" % (-factor) %}
            {% if ns.over > 0 and ns.room >= ns.over %}
                {% set advice = advice ~ ", or move it %.1f mm left (%.1f mm of room on the left)" % (ns.over, ns.room) %}
            {% endif %}
            {action_raise_error("Print stopped before heating: out of range with skew correction. " ~ ns.msgs|join("; ") ~ ". " ~ advice ~ ". To ignore this check: PRINT_START SKIP_BOUNDS=1.")}
        {% endif %}
    {% endif %}

[gcode_macro _PRINT_START_RECOVER]
description: Called by RESUME: re-runs the print start steps if they did not finish
gcode:
    {% if printer["gcode_macro _SOAK_STATE"].finish_pending %}
        RESPOND MSG="Print start did not finish (mesh, nozzle heat or purge): running it again before resuming"
        _PRINT_START_FINISH
    {% endif %}

# ---------------------------------------------------------------- heat soak (non-blocking)
[gcode_macro _SOAK_STATE]
variable_active: 0
variable_seconds_left: 0
variable_chamber: 0
variable_bed_target: 0
variable_chamber_wait_left: 0
variable_resume_print: 0
variable_extruder: 240
variable_preheat: 150
variable_filament: "Manual"
variable_mesh: "adaptive"
variable_finish_pending: 0
variable_soak_total: 0
variable_last_tick: 0.0
variable_park_z: 3.0
variable_qgl_done: 0
variable_prewarm: 0
gcode:

[gcode_macro _HEAT_SOAK_BEGIN]
gcode:
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE={params.SECONDS|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=soak_total VALUE={params.SECONDS|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=last_tick VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=park_z VALUE={params.PARK_Z|default(3)|float}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=qgl_done VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=prewarm VALUE=0
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber VALUE={params.CHAMBER|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=bed_target VALUE={params.BED|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber_wait_left VALUE=1800
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE={params.RESUME_PRINT|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10

[delayed_gcode _HEAT_SOAK_TIMER]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    {% set p = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% if s.active %}
        # Count real elapsed time (Klipper's clock), so a tick that levels the gantry for
        # ~80 s counts as ~80 s of soak, not 10
        {% set now = printer.toolhead.estimated_print_time %}
        {% set dt = (now - s.last_tick) if s.last_tick > 0 else 10 %}
        {% set left = (s.seconds_left - dt)|int %}
        {% set chamber_ok = s.chamber == 0 or printer["temperature_sensor chamber"].temperature >= s.chamber %}
        G4 P10                     ; tiny dwell keeps idle_timeout from shutting the heaters off
        SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=last_tick VALUE={now}
        {% if printer.heater_bed.temperature < s.bed_target - 1 %}
            M117 {s.filament} bed {printer.heater_bed.temperature|int}/{s.bed_target}C
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% elif left > 0 %}
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE={left}
            # Level the gantry half-way through the soak (at least 1 min in), when the frame has
            # mostly stopped expanding (QGL after 1 min drifted between rounds, 2026-11-03). QGL is
            # contactless, the nozzle stays cold; only if not levelled since the motors were on.
            {% if s.resume_print and not s.qgl_done and (s.soak_total - left) >= [60, s.soak_total / 2]|max %}
                SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=qgl_done VALUE=1
                {% if not printer.quad_gantry_level.applied %}
                    RESPOND MSG="Leveling the gantry during the soak"
                    M117 {s.filament} soak: leveling gantry
                    QUAD_GANTRY_LEVEL
                    G90
                    G0 X{p.center_x} Y{p.center_y} F6000
                    G0 Z{s.park_z} F600
                {% endif %}
            {% endif %}
            # Start warming the nozzle ~90 s before the end, ready for the tap
            {% if s.resume_print and s.preheat > 0 and left <= 90 and not s.prewarm %}
                SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=prewarm VALUE=1
                M104 S{s.preheat}
            {% endif %}
            M117 {s.filament} soak {(left / 60)|round(0, 'ceil')|int}m left
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% elif not chamber_ok and s.chamber_wait_left > 0 %}
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=seconds_left VALUE=0
            SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=chamber_wait_left VALUE={s.chamber_wait_left - 10}
            M117 {s.filament} chamber to {s.chamber}C
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=10
        {% else %}
            _HEAT_SOAK_DONE
        {% endif %}
    {% endif %}

[gcode_macro _HEAT_SOAK_DONE]
gcode:
    {% set s = printer["gcode_macro _SOAK_STATE"] %}
    # Z offset now, including any babysteps made during the soak (re-applied after the resume)
    {% set z_offset = printer.gcode_move.homing_origin.z %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TIMER DURATION=0
    RESPOND MSG="{s.filament} heat soak done"
    M117 {s.filament} soak done
    {% if s.resume_print %}
        SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=resume_print VALUE=0
        _PRINT_START_FINISH
        # RESUME_BASE would move back to where PAUSE_BASE stopped (bed centre, Z soak_park_z):
        # a trip across the bed after the purge. Keep the slicer's modes from the pause but
        # store the post-purge position, so the print starts from the purge.
        RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=0
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        RESUME_BASE
        SET_GCODE_OFFSET Z={z_offset}  ; keep babysteps made during the soak
        {% if z_offset != 0 %}
            RESPOND MSG="Kept Z offset {'%+.3f' % z_offset} from the soak"
        {% endif %}
    {% endif %}

[gcode_macro HEAT_SOAK_SKIP]
description: End the running heat soak now (the print continues normally)
gcode:
    {% if printer["gcode_macro _SOAK_STATE"].active %}
        RESPOND MSG="Heat soak skipped"
        _HEAT_SOAK_DONE
    {% else %}
        RESPOND MSG="No heat soak is running"
    {% endif %}

[gcode_macro HEAT_SOAK_STOP]
description: Stop a manual heat soak (bed stays at temperature)
gcode:
    _SOAK_CANCEL
    RESPOND MSG="Heat soak stopped"
    M117

[gcode_macro HEAT_SOAK_START]
description: Manual heat soak: HEAT_SOAK_START TEMP=100 MINUTES=20 FILAMENT=ASA (non-blocking; HEAT_SOAK_STOP ends it)
gcode:
    {% set p = printer["gcode_macro _PRINTER_SETTINGS"] %}
    {% set temp = params.TEMP|default(100)|int %}
    {% set mins = params.MINUTES|default(20)|int %}
    {% set filament = params.FILAMENT|default("Manual")|string %}
    SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=filament VALUE='"{filament}"'
    RESPOND MSG="Running {filament} heat soak: bed {temp}C for {mins} min once at temperature. HEAT_SOAK_STOP ends it."
    SMART_HOME
    G90
    G1 X{p.center_x} Y{p.center_y} Z20 F6000   ; park nozzle over bed centre
    M140 S{temp}             ; heat bed (no blocking wait; the timer waits for it)
    _HEAT_SOAK_BEGIN SECONDS={mins * 60} BED={temp} CHAMBER=0 RESUME_PRINT=0

# ---------------------------------------------------------------- print end and filament
[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [[th.position.z + 50, 200]|min, th.position.z]|max %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F2100                 ; 2mm stops ooze (KAMP tip_distance matches); more pulls hot
                                   ; filament into the heatbreak and jammed the next print
    FILAMENT_PARK                  ; tip out of the hot zone where enabled (filament_park)
    TURN_OFF_HEATERS
    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle off the part (anti-stringing)
    M107
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1               ; skew only while printing: a skewed Y move during G28 needs X homed
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    M220 S100                      ; speed factor back to 100% (a print slowed from the screen kept it)
    M117 Print done
    {% set vent = printer["gcode_macro _PRINTER_SETTINGS"].exhaust_after_print %}
    {% if vent > 0 and "fan_generic exhaust_fan" in printer %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1   ; vent the fumes, then off
        UPDATE_DELAYED_GCODE ID=_EXHAUST_OFF DURATION={vent * 60}
    {% endif %}

[delayed_gcode _EXHAUST_OFF]
gcode:
    {% if "fan_generic exhaust_fan" in printer %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% endif %}
    PARK
    {% if "gcode_macro WOOD_GRAIN" in printer %}
        SET_GCODE_VARIABLE MACRO=WOOD_GRAIN VARIABLE=enabled VALUE=0
    {% endif %}

[gcode_macro FILAMENT_PARK]
description: Pull the filament tip out of the hot zone so it can't heat-creep while the nozzle idles hot
#   FILAMENT_PARK [LENGTH=filament_park] (only if hot enough and not already parked; off when the
#   printer's filament_park is 0). PRINT_END, CANCEL (user_cancel_macro) and a hot PRINT_START
#   park; _PRINT_START_FINISH reloads in the purge. State in variables.cfg (filament_parked).
#   After loading filament by hand run FILAMENT_LOADED.
gcode:
    {% set length = params.LENGTH|default(printer["gcode_macro _PRINTER_SETTINGS"].filament_park)|float %}
    {% set parked = printer.save_variables.variables.filament_parked|default(0)|float %}
    {% if length > 60 %}
        {action_raise_error("FILAMENT_PARK: LENGTH over 60 mm would pull the filament out of the drive gears")}
    {% endif %}
    {% if length <= 0 %}
        # filament_park 0: this printer does not park filament
    {% elif parked > 0 %}
        RESPOND MSG="Filament already parked ({parked} mm)"
    {% elif printer.extruder.can_extrude %}
        M400
        M83
        G1 E-{length} F600
        SAVE_VARIABLE VARIABLE=filament_parked VALUE={length}
        RESPOND MSG="Filament parked {length} mm above the nozzle"
    {% endif %}

[gcode_macro FILAMENT_LOADED]
description: Tell the printer the filament is loaded to the nozzle (after loading or purging by hand)
gcode:
    SAVE_VARIABLE VARIABLE=filament_parked VALUE=0
    RESPOND MSG="Filament marked as loaded (not parked)"
