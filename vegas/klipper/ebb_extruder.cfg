# BTT EBB36 v1.2 (STM32G0B1, 8 MHz) on the CAN bus since 2026-11-11, mirroring Edmonton's
# ebb_extruder.cfg. Firmware: Katapult (0x08000000, double-tap RST) + Klipper CAN on PB0/PB1 at
# 1 Mbit (builds in ~/fw-ebb36 on the Pi). 120R jumper ON (bus end; the Octopus bridge is the other
# end), VUSB jumper off (24 V from the umbilical). Pins: BTT sample config for EBB CAN v1.2.
[mcu EBBCan]
canbus_uuid: 427c4505af51

[temperature_sensor EBB_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

[adxl345]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: x,y,z                  # check with ACCELEROMETER_QUERY / the Klipper axes check before shaping

[resonance_tester]
accel_chip: adxl345
probe_points: 175,175,20

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1             # check direction with a short extrude before printing
enable_pin: !EBBCan:PD2
rotation_distance: 22.66         # measured 2026-11-08 after the CW2 rebuild (100 mm asked fed 103 mm at 22)
gear_ratio: 50:10                # Clockwork 2
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.600
filament_diameter: 1.75
heater_pin: EBBCan:PB13
sensor_type: Generic 3950        # same 100k NTC as on the Octopus T0
sensor_pin: EBBCan:PA3
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 180
max_extrude_cross_section: 5
pressure_advance: 0.015
# PID: kept in the SAVE_CONFIG block of printer.cfg (same heater cartridge); re-run PID_CALIBRATE if it oscillates

[tmc2209 extruder]
uart_pin: EBBCan:PA15
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Part-cooling blower (24 V) - EBB FAN1
[fan]
pin: EBBCan:PA0
kick_start_time: 0.5
off_below: 0.10

##  Hotend fan - EBB FAN2. It is a 12 V fan on the EBB's 24 V fan output: max_power 0.5 keeps the
##  average at ~12 V (kick start runs at max_power too). Replace with a 24 V fan when possible:
##  the PWM pulses are still 24 V.
[heater_fan hotend_fan]
pin: EBBCan:PA1
max_power: 0.5
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
shutdown_speed: 0                # PA1 is software PWM: on a Klipper shutdown it can only be off or full
                                 # 24 V; with max_power 0.5 the default was refused ("shutdown value must
                                 # be 0.0 or 1.0 on soft pwm"). The heater is off after a shutdown too.
