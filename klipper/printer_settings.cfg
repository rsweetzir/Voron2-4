# Edmonton: printer-specific values for the SHARED macros in shared/ (docs/printer-parity.md).
# Only values that really differ between the printers belong here; the logic is shared.
[gcode_macro _PRINTER_SETTINGS]
variable_center_x: 150         # bed centre (nozzle): Z homing, tap, soak park
variable_center_y: 150
variable_skew_ac: 139.5        # XY skew (CaliFlower AC, BD, AD), SET_SKEW and _CHECK_PRINT_BOUNDS
variable_skew_bd: 141.9
variable_skew_ad: 99.46
variable_filament_park: 48     # mm FILAMENT_PARK pulls the tip up (gears 70 mm above the nozzle); 0 = off
variable_chamber_temp: 42      # PRINT_START waits for this chamber temp at beds >= 100C (needs a chamber sensor); 0 = off
variable_saved_mesh: "eddy_hot60"   # PRINT_START MESH=SAVED loads this profile
variable_tap_temp: 150         # nozzle C for the tap (PLA/PETG)
variable_tap_temp_hard: 180    # nozzle C for the tap with ASA/ABS/PC/PA or beds >= 90C
variable_soak_park_z: 3        # nozzle height over the bed centre during the soak
variable_tap_z_adjust: 0.0      # mm a tap reads above real bed contact (Vegas first layer was ~0.15 high, 2026-11-05)
variable_exhaust_after_print: 0  # minutes PRINT_END runs the exhaust at 100% (no exhaust fan); 0 = off
variable_accel_limit: 20000      # mm/s2 cap on any SET_VELOCITY_LIMIT ACCEL (slicer per feature): no cap in practice (Edmonton prints at the slicer's values)
variable_velocity_limit: 500     # mm/s cap on SET_VELOCITY_LIMIT VELOCITY
variable_qgl_fine_z: 10        # fine QGL probing height (was 7; 10 needs no G28 Z after the coarse pass)
gcode:
