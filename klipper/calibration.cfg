# =====================================================================================
#  Filament calibration suite support (used by tools/calsuite.py G-code)
#
#  The suite G-code prints one test, then calls _CAL_ASK. That pauses the print and
#  shows a Mainsail prompt with one button per option. The button stores the answer
#  (SAVE_VARIABLE, survives restarts) and resumes. Later tests call _CAL_APPLY, which
#  sets temperature / retraction / pressure advance / flow from the answers so far.
#  _CAL_REPORT prints the summary at the end.
# =====================================================================================

[save_variables]
filename: ~/printer_data/config/variables.cfg

# Mainsail PAUSE/RESUME/CANCEL settings:
#  - park at center-back instead of X max (skew correction pushed X max out of range)
#  - longer idle timeout while paused, so a calibration question can wait 2 hours
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 150.0
variable_custom_park_y    : 290.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 150.0
variable_park_at_cancel_y : 290.0
variable_use_fw_retract   : True
variable_idle_timeout     : 7200
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: "_PRINT_START_RECOVER"   # redo mesh/heat/purge if PRINT_START stopped part-way
variable_user_cancel_macro: ""
gcode:

[gcode_macro _CAL]
# current calibration run (filament name and answers so far)
variable_filament: "Unknown"
variable_temp: 210
variable_retract_len: 0.6
variable_retract_speed: 40
variable_pa: 0.0
variable_flow: 100
variable_max_flow: 0
variable_tolerance: 0
gcode:

[gcode_macro _CAL_BEGIN]
description: Start a calibration run: _CAL_BEGIN FILAMENT=PLA_Marble TEMP=210 RETRACT_SPEED=40
gcode:
    {% set f = params.FILAMENT|default("Unknown")|string %}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=filament VALUE='"{f}"'
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=temp VALUE={params.TEMP|default(210)|int}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=retract_len VALUE={params.RETRACT|default(0.6)|float}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=retract_speed VALUE={params.RETRACT_SPEED|default(40)|float}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=pa VALUE={params.PA|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=flow VALUE={params.FLOW|default(100)|int}
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=max_flow VALUE=0
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE=tolerance VALUE=0
    RESPOND MSG="Calibration run started for {f}"

[gcode_macro _CAL_APPLY]
description: Apply the calibration answers so far (temperature, retraction, PA, flow)
gcode:
    {% set c = printer["gcode_macro _CAL"] %}
    {% set what = params.WHAT|default("all")|lower %}
    {% if what in ["all", "temp"] %}
        M109 S{c.temp}
    {% endif %}
    {% if what in ["all", "retract"] %}
        SET_RETRACTION RETRACT_LENGTH={c.retract_len} RETRACT_SPEED={c.retract_speed} UNRETRACT_SPEED=30
    {% endif %}
    {% if what in ["all", "pa"] %}
        SET_PRESSURE_ADVANCE ADVANCE={c.pa}
    {% endif %}
    {% if what in ["all", "flow"] %}
        M221 S{c.flow}
    {% endif %}
    RESPOND MSG="Using {c.filament}: {c.temp}C, retract {c.retract_len}mm@{c.retract_speed}, PA {c.pa}, flow {c.flow}%"

[gcode_macro _CAL_ASK]
description: Pause and ask a calibration question: _CAL_ASK VAR=temp TITLE="..." TEXT="..." OPTIONS="220,215,210" LABELS="220C,215C,210C"
gcode:
    {% set var = params.VAR %}
    {% set opts = params.OPTIONS.split(",") %}
    {% set labels = params.LABELS.split(",") if params.LABELS else opts %}
    {% if params.PARK|default(1)|int == 0 %}
        PAUSE_BASE                 ; pause where the G-code left the nozzle (an empty lane), no park move
    {% else %}
        PAUSE
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE}"
    RESPOND TYPE=command MSG="action:prompt_text {params.TEXT}"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for o in opts %}
        {% if loop.index0 > 0 and loop.index0 % 4 == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button {labels[loop.index0]}|_CAL_ANSWER VAR={var} VALUE={o}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|CANCEL_PRINT|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    M117 Answer in Mainsail

[gcode_macro _CAL_ANSWER]
gcode:
    {% set c = printer["gcode_macro _CAL"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_CAL VARIABLE={params.VAR} VALUE={params.VALUE}
    SAVE_VARIABLE VARIABLE=cal_{c.filament|lower}_{params.VAR} VALUE={params.VALUE}
    RESPOND MSG="{c.filament}: {params.VAR} = {params.VALUE}"
    RESUME

[gcode_macro _CAL_REPORT]
gcode:
    {% set c = printer["gcode_macro _CAL"] %}
    RESPOND MSG="Calibration results for {c.filament}: nozzle {c.temp}C, retraction {c.retract_len}mm @ {c.retract_speed}mm/s, PA {c.pa}, flow {c.flow}%, max volumetric (last good band) {c.max_flow} mm3/s, tolerance (tightest hole the key fits) {c.tolerance}mm"
