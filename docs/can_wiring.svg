<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .boxfut { fill: #ffffff; stroke: #333; stroke-width: 2; stroke-dasharray: 8 5; }
      .title { font-size: 20px; font-weight: bold; fill: #111; }
      .sub { font-size: 14px; fill: #444; }
      .lbl { font-size: 13px; fill: #222; }
      .small { font-size: 12px; fill: #555; }
      .panel { font-size: 24px; font-weight: bold; fill: #111; }
      .on { fill: #1b7f3b; font-weight: bold; }
      .off { fill: #b02a2a; font-weight: bold; }
      .w24 { stroke: #f2c200; stroke-width: 4; fill: none; }
      .w5 { stroke: #d62728; stroke-width: 4; fill: none; }
      .wgnd { stroke: #222; stroke-width: 4; fill: none; }
      .wh { stroke: #ff7f0e; stroke-width: 4; fill: none; }
      .wlo { stroke: #8a8a8a; stroke-width: 6; fill: none; }
      .wl { stroke: #ffffff; stroke-width: 3.5; fill: none; }
      .wpe { stroke: #2ca02c; stroke-width: 4; fill: none; }
      .usb { stroke: #1f77b4; stroke-width: 4; fill: none; }
      .usbold { stroke: #999; stroke-width: 3; fill: none; stroke-dasharray: 6 4; }
      .sig { stroke: #7f3fbf; stroke-width: 3; fill: none; }
      .dash { stroke-dasharray: 7 5; }
      .term { fill: #fff3c4; stroke: #b08900; stroke-width: 1.5; }
      .note { fill: #f5f7fa; stroke: #c9d1db; stroke-width: 1.5; }
      .warn { fill: #fff4f0; stroke: #e0a080; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1260" fill="#fbfbfb"/>
  <text x="40" y="44" font-size="28" font-weight="bold" fill="#111">Voron 2.4 CAN wiring: 6-wire umbilical to EBB (+ Eddy Duo later)</text>
  <text x="40" y="70" class="sub">CAN bus 1 Mbit/s (can0). Exactly two 120 Ω terminators, one at each end. Run orange (CAN-H) and white (CAN-L) as a twisted pair.</text>

  <!-- legend: the six umbilical colours -->
  <g transform="translate(880,88)">
    <rect x="0" y="0" width="680" height="70" class="note" rx="6"/>
    <line x1="14" y1="22" x2="50" y2="22" class="w24"/><text x="58" y="27" class="lbl">yellow +24 V</text>
    <line x1="170" y1="22" x2="206" y2="22" class="w5"/><text x="214" y="27" class="lbl">red +5 V</text>
    <line x1="306" y1="22" x2="342" y2="22" class="wgnd"/><text x="350" y="27" class="lbl">black GND</text>
    <line x1="450" y1="22" x2="486" y2="22" class="wpe"/><text x="494" y="27" class="lbl">green chassis gnd</text>
    <line x1="14" y1="50" x2="50" y2="50" class="wh"/><text x="58" y="55" class="lbl">orange CAN-H</text>
    <line x1="170" y1="50" x2="206" y2="50" class="wlo"/><line x1="170" y1="50" x2="206" y2="50" class="wl"/><text x="214" y="55" class="lbl">white CAN-L</text>
    <line x1="306" y1="50" x2="342" y2="50" class="usb"/><text x="350" y="55" class="lbl">USB</text>
    <line x1="450" y1="50" x2="486" y2="50" class="sig"/><text x="494" y="55" class="lbl">probe signal</text>
  </g>

  <!-- ================================================================ PANEL 1 -->
  <text x="40" y="132" class="panel">1. Now — EBB on CAN, inductive probe kept</text>
  <rect x="30" y="170" width="1540" height="500" fill="none" stroke="#ccc" stroke-width="1.5" rx="10"/>

  <!-- PSUs -->
  <rect x="60" y="195" width="200" height="70" class="box"/>
  <text x="80" y="225" class="title">24 V PSU</text>
  <text x="80" y="249" class="small">V+ / V−</text>
  <rect x="60" y="280" width="200" height="70" class="box"/>
  <text x="80" y="310" class="title">5 V supply</text>
  <text x="80" y="334" class="small">V− common with 24 V V−</text>

  <!-- Pi -->
  <rect x="60" y="375" width="200" height="110" class="box"/>
  <text x="80" y="405" class="title">Printer Pi</text>
  <text x="80" y="428" class="sub">YEG2-4</text>
  <text x="80" y="448" class="small">Klipper · can0 @ 1 Mbit/s</text>
  <text x="80" y="466" class="small">(systemd-networkd)</text>

  <!-- SKR Pro -->
  <rect x="60" y="525" width="200" height="70" class="box"/>
  <text x="80" y="555" class="title">SKR Pro v1.2</text>
  <text x="80" y="577" class="small">unchanged: USB to Pi</text>
  <path d="M160,525 L160,485" class="usbold"/>

  <!-- frame / PE -->
  <rect x="60" y="610" width="200" height="45" class="box"/>
  <text x="80" y="638" class="lbl" font-weight="bold">Frame / mains PE</text>

  <!-- adapter -->
  <rect x="320" y="385" width="250" height="140" class="box"/>
  <text x="340" y="417" class="title">USB-CAN adapter</text>
  <text x="340" y="439" class="sub">xCAN · STM32F072C8T6</text>
  <text x="340" y="459" class="small">candleLight (gs_usb) · 1d50:606f</text>
  <rect x="340" y="475" width="44" height="30" class="term" rx="4"/><text x="345" y="495" class="small">120Ω</text>
  <text x="392" y="495" class="lbl on">ON (bus end #1)</text>
  <path d="M260,430 L320,430" class="usb"/>
  <text x="268" y="422" class="small">USB</text>

  <!-- frame-end terminal block -->
  <rect x="660" y="200" width="160" height="420" class="box"/>
  <text x="675" y="228" class="title">Umbilical</text>
  <text x="675" y="250" class="title">frame end</text>
  <text x="675" y="270" class="small">terminal block</text>
  <circle cx="660" cy="300" r="5" fill="#f2c200"/><text x="675" y="305" class="lbl">24 V  yellow</text>
  <circle cx="660" cy="345" r="5" fill="#d62728"/><text x="675" y="350" class="lbl">5 V  red</text>
  <circle cx="660" cy="390" r="5" fill="#222"/><text x="675" y="395" class="lbl">GND  black</text>
  <circle cx="660" cy="450" r="5" fill="#ff7f0e"/><text x="675" y="455" class="lbl">CAN-H  orange</text>
  <circle cx="660" cy="490" r="5" fill="#fff" stroke="#8a8a8a" stroke-width="2"/><text x="675" y="495" class="lbl">CAN-L  white</text>
  <circle cx="660" cy="580" r="5" fill="#2ca02c"/><text x="675" y="585" class="lbl">chassis  green</text>

  <!-- feeds into block -->
  <path d="M260,215 L630,215 L630,300 L660,300" class="w24"/>
  <path d="M260,305 L615,305 L615,345 L660,345" class="w5"/>
  <path d="M260,250 L600,250 L600,390 L660,390" class="wgnd"/>
  <path d="M260,335 L600,335" class="wgnd"/>
  <path d="M570,450 L660,450" class="wh"/>
  <path d="M570,490 L660,490" class="wlo"/><path d="M570,490 L660,490" class="wl"/>
  <path d="M570,410 L585,410 L585,390 L600,390" class="wgnd dash"/>
  <path d="M260,632 L630,632 L630,580 L660,580" class="wpe"/>
  <text x="330" y="555" class="small">adapter GND → black (common ground),</text>
  <text x="330" y="571" class="small">if the adapter has a GND terminal</text>

  <!-- umbilical cable -->
  <path d="M820,300 L1040,300" class="w24"/>
  <path d="M820,345 L1040,345" class="w5"/>
  <path d="M820,390 L1040,390" class="wgnd"/>
  <path d="M820,450 C850,442 870,458 900,450 C930,442 950,458 980,450 L1040,450" class="wh"/>
  <path d="M820,490 C850,498 870,482 900,490 C930,498 950,482 980,490 L1040,490" class="wlo"/>
  <path d="M820,490 C850,498 870,482 900,490 C930,498 950,482 980,490 L1040,490" class="wl"/>
  <path d="M820,580 L1040,580" class="wpe"/>
  <text x="850" y="280" class="sub">6-wire umbilical</text>
  <text x="850" y="525" class="small">orange / white twisted pair</text>

  <!-- toolhead end -->
  <rect x="1040" y="250" width="290" height="300" class="box"/>
  <text x="1060" y="282" class="title">BTT EBBCan (EBB36/42)</text>
  <text x="1060" y="304" class="sub">STM32G0B1 · firmware ebb-can</text>
  <text x="1060" y="324" class="small">CAN on PB0/PB1 · [mcu EBBCan]</text>
  <text x="1060" y="352" class="lbl">CAN in: 24V · GND · H · L</text>
  <text x="1060" y="372" class="lbl">(yellow · black · orange · white)</text>
  <text x="1060" y="400" class="small">red 5 V: not used by the EBB;</text>
  <text x="1060" y="416" class="small">insulate and park at the toolhead</text>
  <rect x="1060" y="432" width="44" height="30" class="term" rx="4"/><text x="1065" y="452" class="small">120Ω</text>
  <text x="1112" y="452" class="lbl on">ON (bus end #2)</text>
  <text x="1060" y="490" class="lbl">USB: unplugged after flashing</text>
  <text x="1060" y="510" class="small">(only for DFU firmware updates)</text>
  <text x="1060" y="530" class="small">canbus_uuid from canbus_query.py</text>

  <!-- chassis at toolhead -->
  <rect x="1040" y="565" width="290" height="80" class="box"/>
  <text x="1060" y="592" class="lbl" font-weight="bold">Toolhead metal</text>
  <text x="1060" y="612" class="small">hotend / heatsink / frame bolt</text>
  <text x="1060" y="630" class="small">green only — not to black GND here</text>

  <!-- inductive probe -->
  <rect x="1390" y="260" width="160" height="150" class="box"/>
  <text x="1405" y="290" class="title">Inductive</text>
  <text x="1405" y="312" class="title">probe</text>
  <text x="1405" y="336" class="small">stays on EBB</text>
  <text x="1405" y="352" class="small">probe port, as now</text>
  <text x="1405" y="376" class="small">[probe] pin:</text>
  <text x="1405" y="392" class="small">~!EBBCan:PB9</text>
  <path d="M1330,330 L1390,330" class="sig"/>
  <text x="1390" y="440" class="small">No Klipper change for</text>
  <text x="1390" y="456" class="small">the probe: it moves to</text>
  <text x="1390" y="472" class="small">CAN with the EBB.</text>

  <!-- ================================================================ PANEL 2 -->
  <text x="40" y="722" class="panel">2. Later — Eddy Duo plugs into the EBB (5 V + CAN pass-through), umbilical unchanged</text>
  <rect x="30" y="740" width="1540" height="330" fill="none" stroke="#ccc" stroke-width="1.5" rx="10"/>

  <rect x="60" y="780" width="270" height="120" class="box"/>
  <text x="80" y="812" class="title">Pi + adapter + PSUs</text>
  <text x="80" y="836" class="sub">as in panel 1</text>
  <rect x="80" y="854" width="44" height="28" class="term" rx="4"/><text x="85" y="873" class="small">120Ω</text>
  <text x="132" y="873" class="lbl on">ON (end #1)</text>

  <!-- umbilical, unchanged: 4 wires into the EBB, red spare, green to metal -->
  <path d="M330,800 L700,800" class="w24"/>
  <path d="M330,818 L560,818" class="w5"/>
  <path d="M330,836 L700,836" class="wgnd"/>
  <path d="M330,854 L700,854" class="wh"/>
  <path d="M330,872 L700,872" class="wlo"/><path d="M330,872 L700,872" class="wl"/>
  <path d="M330,890 L520,890" class="wpe"/>
  <text x="400" y="784" class="sub">6-wire umbilical (unchanged)</text>
  <line x1="560" y1="811" x2="560" y2="825" stroke="#333" stroke-width="3"/>
  <text x="568" y="822" class="small">red: spare, insulated</text>
  <text x="528" y="894" class="small">green → toolhead metal</text>

  <!-- EBB -->
  <rect x="700" y="765" width="330" height="285" class="box"/>
  <text x="790" y="795" class="title">BTT EBBCan (36/42)</text>
  <text x="712" y="804" class="small">24V</text><text x="712" y="840" class="small">GND</text>
  <text x="712" y="858" class="small">CAN-H</text><text x="712" y="876" class="small">CAN-L</text>
  <text x="712" y="904" class="small">CAN power connector</text>
  <rect x="712" y="920" width="44" height="28" class="term" rx="4"/><text x="717" y="939" class="small">120Ω</text>
  <text x="764" y="939" class="lbl on">ON (keep) · bus end #2</text>
  <text x="712" y="972" class="small">CAN-H / CAN-L pass through to the two</text>
  <text x="712" y="988" class="small">pins beside the CAN power connector;</text>
  <text x="712" y="1004" class="small">5 V + GND from a header pin (the EBB's</text>
  <text x="712" y="1020" class="small">own 5 V regulator, Eddy draws ~30 mA).</text>
  <text x="712" y="1040" class="small">Pin spots: BTT Eddy manual §4.12 / §4.13</text>
  <!-- EBB outputs -->
  <text x="1022" y="884" class="small" text-anchor="end">5V</text>
  <text x="1022" y="904" class="small" text-anchor="end">CAN-L</text>
  <text x="1022" y="924" class="small" text-anchor="end">CAN-H</text>
  <text x="1022" y="944" class="small" text-anchor="end">GND</text>
  <circle cx="1030" cy="880" r="4" fill="#d62728"/><circle cx="1030" cy="900" r="4" fill="#fff" stroke="#333"/>
  <circle cx="1030" cy="920" r="4" fill="#ff7f0e"/><circle cx="1030" cy="940" r="4" fill="#222"/>

  <!-- Eddy cable -->
  <path d="M1030,880 L1090,880" class="w5"/>
  <path d="M1030,900 L1090,900" class="wlo"/><path d="M1030,900 L1090,900" class="wl"/>
  <path d="M1030,920 L1090,920" class="wh"/>
  <path d="M1030,940 L1090,940" class="wgnd"/>

  <!-- Eddy -->
  <rect x="1090" y="845" width="200" height="205" class="boxfut"/>
  <text x="1105" y="870" class="title">BTT Eddy Duo</text>
  <text x="1100" y="884" class="small">5V</text><text x="1100" y="904" class="small">CAN-L</text>
  <text x="1100" y="924" class="small">CAN-H</text><text x="1100" y="944" class="small">GND</text>
  <text x="1105" y="968" class="small">5 V only — never 24 V</text>
  <text x="1105" y="986" class="small">DIP switch → CAN</text>
  <text x="1105" y="1004" class="small">fw: RX gpio4, TX gpio5</text>
  <rect x="1105" y="1014" width="44" height="28" class="term" rx="4"/><text x="1110" y="1033" class="small">120Ω</text>
  <text x="1157" y="1033" class="lbl off">OFF</text>

  <!-- notes -->
  <rect x="1310" y="765" width="240" height="285" class="warn" rx="8"/>
  <text x="1325" y="793" font-size="16" font-weight="bold" fill="#a33">Eddy Duo notes</text>
  <text x="1325" y="819" class="small">Supply is 5 V (BTT manual,</text>
  <text x="1325" y="835" class="small">30 mA). 24 V will destroy it.</text>
  <text x="1325" y="861" class="small">Plug order (BTT pictures):</text>
  <text x="1325" y="877" class="small">5V · CAN-L · CAN-H · GND.</text>
  <text x="1325" y="893" class="small">Its own cable colours are red</text>
  <text x="1325" y="909" class="small">5V, grey CAN-L, green CAN-H,</text>
  <text x="1325" y="925" class="small">black GND — wire by function,</text>
  <text x="1325" y="941" class="small">not to the umbilical green.</text>
  <text x="1325" y="967" class="small">Flash its CAN firmware while</text>
  <text x="1325" y="983" class="small">still in USB mode, then set</text>
  <text x="1325" y="999" class="small">the DIP switch to CAN.</text>
  <text x="1325" y="1025" class="small">One 120 Ω at the toolhead:</text>
  <text x="1325" y="1041" class="small">EBB ON, Eddy OFF.</text>

  <!-- footer notes -->
  <rect x="30" y="1090" width="1540" height="155" class="note" rx="8"/>
  <text x="50" y="1118" font-size="16" font-weight="bold" fill="#222">Checklist</text>
  <text x="50" y="1144" class="lbl">• Termination: exactly two 120 Ω, at the adapter and the far end. Bus powered off: orange to white should measure about 60 Ω.</text>
  <text x="50" y="1166" class="lbl">• Red is 5 V here, not 24 V: label both ends so nobody assumes red = 24 V. Before plugging in a board, meter yellow–black ≈ 24 V and red–black ≈ 5 V.</text>
  <text x="50" y="1188" class="lbl">• Green chassis ground: frame / PE at the frame end, toolhead metal at the far end. Never use it as a return for 24 V, 5 V or CAN.</text>
  <text x="50" y="1210" class="lbl">• Wire to each board's silkscreen (24V / GND / H / L), not by pin position. Swapped orange/white gives no nodes in canbus_query.py.</text>
  <text x="50" y="1232" class="lbl">• Eddy Duo and EBB are at the same end of the bus: one 120 Ω there (EBB ON, Eddy OFF), no jumper change when the Eddy arrives. Steps: firmware/ebb-can.md, firmware/candlelight/README.md.</text>
</svg>
